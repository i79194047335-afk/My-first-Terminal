/** Ручной ввод R (в TV-шкале) → поинты, применить. */
function rApplyManual(paneId, val) {
    const tv = parseFloat(String(val).replace(",", "."));
    if (!tv || tv <= 0) return;
    const points = tvToPoints(tv, currentSymbol);
    if (!(points > 0) || points > 10000) return;
    rangeSizing(currentSymbol).mode = "manual";
    if (!layout[`pane${paneId}`]?.rangeOn) setRangeOn(paneId, true);
    applyRangePoints(points, paneId);
    refreshOpenRMenus();
}

// ── Лента крупных сделок ───────────────────────────────────────────────────
// Хаб шлёт large_trade широковещательно по всем инструментам; фильтруем по
// текущему символу — смотрят всегда один. Порог считает сервер (95-й
// процентиль за скользящий час), фронт его только показывает.
let tapeVisible = false;
const TAPE_MAX_ROWS = 60;
let _tapeLastThreshold = null;

/**
 * Показать или скрыть панель ленты.
 * @returns {void}
 */
function toggleTape() {
    tapeVisible = !tapeVisible;
    layout.showTape = tapeVisible;
    StorageLayer.autoSave(layout);
    applyTapeVisibility();
}

/**
 * Привести панель и кнопку в соответствие состоянию.
 * @returns {void}
 */
function applyTapeVisibility() {
    const panel = document.getElementById("tapePanel");
    const btn   = document.getElementById("tapeBtn");
    if (!panel) return;
    panel.classList.toggle("on", tapeVisible);
    if (btn) btn.classList.toggle("on", tapeVisible);
    if (tapeVisible) renderTapeHeader();
}

/**
 * Обновить шапку ленты: символ и текущий порог.
 * @returns {void}
 */
function renderTapeHeader() {
    const sym = document.getElementById("tapeSymbol");
    const thr = document.getElementById("tapeThreshold");
    if (sym) sym.textContent = displaySymbol(currentSymbol);
    if (!thr) return;
    if (!instrumentsWithVolume.has(currentSymbol)) {
        thr.textContent = "";
    } else if (_tapeLastThreshold == null) {
        thr.textContent = "ждёт данных";
    } else {
        thr.textContent = "> " + formatTapeSize(_tapeLastThreshold);
    }
}

/**
 * Компактно отформатировать размер сделки.
 * @param {number} v Размер в базовых единицах.
 * @returns {string}
 */
function formatTapeSize(v) {
    if (v >= 1000) return v.toFixed(0);
    if (v >= 1)    return v.toFixed(2);
    return v.toPrecision(3);
}

/**
 * Компактно отформатировать оборот в долларах.
 * @param {number} v Оборот.
 * @returns {string}
 */
function formatTapeQuote(v) {
    if (v >= 1e6) return "$" + (v / 1e6).toFixed(2) + "M";
    if (v >= 1e3) return "$" + (v / 1e3).toFixed(1) + "k";
    return "$" + v.toFixed(0);
}

/**
 * Добавить сделку в ленту.
 * Чужие инструменты игнорируются: события приходят по всем 12 сразу.
 * @param {object} msg Сообщение large_trade от хаба.
 * @returns {void}
 */
function addTapeTrade(msg) {
    if (msg.symbol !== currentSymbol) return;
    _tapeLastThreshold = msg.threshold;
    if (!tapeVisible) return;

    const rows = document.getElementById("tapeRows");
    if (!rows) return;

    const empty = document.getElementById("tapeEmpty");
    if (empty) empty.remove();

    const d = new Date((msg.ts + TZ_OFFSET * 3600) * 1000);
    const hh = String(d.getUTCHours()).padStart(2, "0");
    const mm = String(d.getUTCMinutes()).padStart(2, "0");
    const ss = String(d.getUTCSeconds()).padStart(2, "0");

    const row = document.createElement("div");
    row.className = "tape-row fresh " + (msg.side === "buy" ? "buy" : "sell");
    row.innerHTML =
        '<span class="tape-time">' + hh + ":" + mm + ":" + ss + '</span>' +
        '<span class="tape-price">' + msg.price + '</span>' +
        '<span class="tape-quote">' + formatTapeQuote(msg.quote) + '</span>';
    row.title = (msg.side === "buy" ? "Покупка" : "Продажа") +
                " " + formatTapeSize(msg.size) +
                " по " + msg.price;

    rows.prepend(row);
    // Лента растёт бесконечно, если её не подрезать: по BTC это ~7500
    // событий за 8 часов, и DOM распух бы до неработоспособности.
    while (rows.childElementCount > TAPE_MAX_ROWS) rows.lastElementChild.remove();

    renderTapeHeader();
}

/**
 * Очистить ленту (смена символа) и показать поясняющую заглушку.
 * @returns {void}
 */
function resetTape() {
    _tapeLastThreshold = null;
    const rows = document.getElementById("tapeRows");
    if (rows) {
        rows.innerHTML = "";
        const note = document.createElement("div");
        note.id = "tapeEmpty";
        note.textContent = instrumentsWithVolume.has(currentSymbol)
            ? "Ждём крупных сделок. Порог — крупнее 95% сделок за последний час; пока статистика не набрана, лента молчит."
            : "У этого инструмента нет биржевого объёма — лента доступна только на Lighter.";
        rows.appendChild(note);
    }
    renderTapeHeader();
}

// ── Карточка инструмента ──
let tickerData  = {};      // provider → { symbol → поля сводки }
let infoVisible = false;

/**
 * Компактная запись больших чисел: 685266221 → "685.3M".
 * @param {number} v Значение.
 * @returns {string}
 */
function fmtCompact(v) {
    if (!isFinite(v)) return "—";
    const a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toFixed(2) + "B";
    if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
    if (a >= 1e3) return (v / 1e3).toFixed(1) + "K";
    return v.toFixed(2);
}

/**
 * Время до следующего фандинга. У Lighter он ежечасный, поэтому это просто
 * остаток текущего часа.
 * @returns {string} "МM:СC".
 */
function nextFundingIn() {
    const left = 3600 - (Date.now() / 1000) % 3600;
    const m = Math.floor(left / 60), s = Math.floor(left % 60);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/**
 * Сводка по текущему инструменту или null, если её нет.
 * @returns {object|null}
 */
function currentTicker() {
    const [provider, bare] = currentSymbol.includes(":")
        ? currentSymbol.split(":") : [null, currentSymbol];
    if (provider) return (tickerData[provider] || {})[bare] || null;
    // Голое имя (старая вкладка) — ищем перебором.
    for (const data of Object.values(tickerData))
        if (data[bare]) return data[bare];
    return null;
}

/**
 * Отрисовать карточку инструмента.
 * @returns {void}
 */
function renderInfo() {
    const el = document.getElementById("infoPanel");
    if (!el) return;
    const t = currentTicker();
    if (!t) {
        el.innerHTML = '<div class="ip-title">' + displaySymbol(currentSymbol)
            + '</div><div class="ip-none">Нет данных: биржевая сводка есть '
            + 'только у крипты.</div>';
        return;
    }

    const dec = instrumentPrecision[currentSymbol]?.precision ?? 2;
    const chCls = t.change_pct >= 0 ? "ip-up" : "ip-dn";
    const chTxt = (t.change_pct >= 0 ? "+" : "") + t.change_pct.toFixed(2) + "%";
    const fund  = t.funding === null || t.funding === undefined
        ? "—" : (t.funding * 100).toFixed(4) + "%";
    const fCls  = (t.funding || 0) >= 0 ? "ip-up" : "ip-dn";

    const rows = [
        ["Mark Price",   t.mark.toFixed(dec)],
        ["Index Price",  t.index.toFixed(dec)],
        ["24h Change",   '<span class="' + chCls + '">' + chTxt + "</span>"],
        ["24h High/Low", t.high.toFixed(dec) + " / " + t.low.toFixed(dec)],
        ["24h Volume",   "$" + fmtCompact(t.vol_quote_24h)],
        ["24h Trades",   fmtCompact(t.trades_24h)],
        ["Open Interest", "$" + fmtCompact(t.oi_quote)],
        ["1h Funding",   '<span class="' + fCls + '">' + fund + "</span>"],
        ["Next Funding", nextFundingIn()],
    ];

    el.innerHTML = '<div class="ip-title"><span>'
        + displaySymbol(currentSymbol) + "</span><span>"
        + t.last.toFixed(dec) + "</span></div>"
        + rows.map(([k, v]) => '<div class="ip-row"><span class="ip-k">'
            + k + '</span><span class="ip-v">' + v + "</span></div>").join("");
}

/**
 * Показать или скрыть карточку инструмента.

 */
function toggleInfo() {

/**
 * Отрисовать общий блок по крипторынку.
 *
 * Отдельно от парного брифинга: у крипты нет поштучного разбора, зато есть
 * то, чего нет у форекса — новости про биржу, где мы торгуем.
 * @param {HTMLElement} el Контейнер.
 * @param {object} c Блок crypto из брифинга.
 * @returns {void}
 */
function renderCryptoBriefing(el, c) {
    const dir  = (c.direction || "NEUTRAL").toLowerCase();
    const col  = dir === "up" ? "#26a69a" : dir === "down" ? "#ef5350" : "#888";
    const esc  = s => String(s ?? "").replace(/[<>&]/g,
        ch => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[ch]));
    const sect = (title, body) => body
        ? "<div style='margin:12px 0'><div style='opacity:.65;font-size:11px;"
          + "text-transform:uppercase;letter-spacing:.4px'>" + title
          + "</div><div style='margin-top:4px'>" + esc(body) + "</div></div>"
        : "";

    // Новости про биржу — первыми и заметно: они бьют по всем инструментам.
    const alerts = (c.venue_alerts || []).filter(Boolean);
    const alertsHtml = alerts.length
        ? "<div style='margin:12px 0;padding:8px 10px;border-radius:6px;"
          + "background:rgba(239,83,80,.15);border:1px solid rgba(239,83,80,.4)'>"
          + "<div style='font-weight:600;margin-bottom:4px'>⚠ Биржа Lighter</div>"
          + alerts.map(a => "<div>• " + esc(a) + "</div>").join("") + "</div>"
        : "";

    const events = (c.key_events || []).filter(Boolean);
    const eventsHtml = events.length
        ? sect("События", events.join(" · ")) : "";

    el.innerHTML =
        "<div style='font-weight:600;font-size:14px'>Крипторынок "
        + "<span style='color:" + col + "'>" + esc(c.direction || "NEUTRAL")
        + "</span>"
        + (c.direction_confidence
            ? " <span style='opacity:.6;font-size:12px'>уверенность "
              + esc(c.direction_confidence) + "/5</span>" : "")
        + "</div>"
        + alertsHtml
        + sect("Картина", c.summary)
        + sect("Наши инструменты", c.our_assets)
        + eventsHtml
        + sect("За чем следить", c.watch_for);
}

function renderBriefing() {
    const content = document.getElementById("briefContent");
    if (!content) return;

    if (!lastBriefingData || !lastBriefingData.pairs) {
        content.innerHTML =
            "<div style='color:#888;text-align:center;margin-top:40px'>" +
            "Нет данных брифинга</div>";
        return;
    }

    // Брифинг пишет pre_session_brief.py со СВОИМИ ключами — голыми парами
    // ("EUR/USD"). Менять его формат ради префикса незачем: ищем по
    // короткому имени.
    const pairData = lastBriefingData.pairs[displaySymbol(currentSymbol)];
    if (!pairData) {
        // Крипта разбирается ОБЩИМ блоком, а не поштучно: по каждой монете
        // отдельно новостей не набирается. Показываем его вместо заглушки.
        const c = lastBriefingData.crypto;
        if (c && instrumentsWithVolume.has(currentSymbol)) {
            renderCryptoBriefing(content, c);
            return;
        }
        content.innerHTML =
            "<div style='color:#888;text-align:center;margin-top:40px'>" +
            "Нет брифинга для " + displaySymbol(currentSymbol) + "</div>";
        return;
    }

    const meta = lastBriefingData.meta || {};
    const globalCtx = lastBriefingData.global_context || {};

    const dir = (pairData.direction || "NEUTRAL").toLowerCase();
    const dirClass = dir === "up" ? "bias-up" : dir === "down" ? "bias-down" : "bias-neutral";
    const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "◆";
    const dirLabel = dir === "up" ? "BULLISH" : dir === "down" ? "BEARISH" : "NEUTRAL";

    const fmtLevel = function(v) {
        if (typeof v === "number") return v.toFixed(5);
        return String(v);
    };
    const supports = (pairData.support_levels || []).map(fmtLevel).join(", ");
    const resistances = (pairData.resistance_levels || []).map(fmtLevel).join(", ");

    let staleHtml = "";
    if (meta.generated_ts) {
        const ageHours = (Date.now() / 1000 - meta.generated_ts) / 3600;
        if (ageHours > 13) {
            staleHtml = "<div style='color:#ff8a80;font-size:10px;margin-top:6px'>" +
                "⚠️ Брифинг устарел (" + Math.round(ageHours) + " ч назад)</div>";
        }
    }

    let html = "";

    // Форматируем время в UTC+5
    let timeStr = "N/A";
    if (meta.generated_ts) {
        const d = new Date((meta.generated_ts + TZ_OFFSET * 3600) * 1000);
        const hh = String(d.getUTCHours()).padStart(2, "0");
        const mm = String(d.getUTCMinutes()).padStart(2, "0");
        const dd = String(d.getUTCDate()).padStart(2, "0");
        const MM = String(d.getUTCMonth() + 1).padStart(2, "0");
        timeStr = hh + ":" + mm + " UTC+5 (" + dd + "." + MM + ")";
    }

    // Сессия: в открытый рынок — «Лондонская (08:00–17:00 UTC)»; в закрытый
    // (выходные) — честная пометка «рынок закрыт — обзор к открытию» вместо
    // ложной «текущей сессии», которой в выходные нет.
    const sessionLabel = (meta.market_open === false)
        ? "🔒 Рынок закрыт — обзор к открытию"
        : "📅 " + (meta.session_label_ru || meta.session_label || meta.session || "") +
          " (" + (meta.session_start_utc || "") + "–" + (meta.session_end_utc || "") + " UTC)";
    html += "<div class='meta'>" +
        sessionLabel +
        " | 🕐 Составлен: " + timeStr +
        " | Волатильность: " + (globalCtx.session_volatility || "N/A") +
        " | Риск: " + (globalCtx.risk_appetite || "N/A") +
        "</div>";

    html += "<h2>" + displaySymbol(currentSymbol) +
        " <span class='" + dirClass + "' style='font-size:16px;margin-left:8px'>" +
        arrow + " " + dirLabel + " (conf: " + (pairData.direction_confidence || "?") + "/5)" +
        "</span></h2>";

    html += staleHtml;

    // Повалютный bias убран: дублировал попарные направления и путал
    // (обе валюты пары могли выйти BULLISH одновременно). Направление теперь
    // ясно из «Консенсус аналитиков» + «Мысль DeepSeek».

    html += "<div class='section'>" +
        "<div class='section-title'>Технический анализ</div>" +
        "<div>" + (pairData.technical_summary || "Нет данных.") + "</div>" +
        "</div>";

    // Консенсус аналитиков и мысль DeepSeek — раздельно (новый формат брифинга).
    // Показываем, только если движок их дал (старый формат их не имеет).
    const biasBadge = function(d) {
        const x = (d || "NEUTRAL").toUpperCase();
        const cls = x === "UP" ? "bias-up" : x === "DOWN" ? "bias-down" : "bias-neutral";
        const ar  = x === "UP" ? "▲" : x === "DOWN" ? "▼" : "◆";
        const lbl = x === "UP" ? "BULLISH" : x === "DOWN" ? "BEARISH" : "NEUTRAL";
        return "<span class='" + cls + "'>" + ar + " " + lbl + "</span>";
    };
    if (pairData.consensus_view || pairData.consensus_direction) {
        html += "<div class='section'>" +
            "<div class='section-title'>Консенсус аналитиков " +
            biasBadge(pairData.consensus_direction) + "</div>" +
            "<div>" + (pairData.consensus_view || "—") + "</div>" +
            "</div>";
    }
    if (pairData.deepseek_view) {
        // Согласие/расхождение подсвечиваем по тексту мысли модели.
        const dv = pairData.deepseek_view;
        const disagree = /расхожден|не согла/i.test(dv);
        const tag = disagree
            ? "<span style='color:#ffa726'>⚠ расхождение</span>"
            : "<span style='color:#26a69a'>✓ согласие</span>";
        html += "<div class='section'>" +
            "<div class='section-title'>🤖 Мысль DeepSeek " + tag + "</div>" +
            "<div>" + dv + "</div>" +
            "</div>";
    }

    html += "<div class='section'>" +
        "<div class='section-title'>Ключевые уровни</div>" +
        "<div><span style='color:#ef5350'>Resistance:</span> " +
        "<span class='level'>" + (resistances || "N/A") + "</span></div>" +
        "<div><span style='color:#26a69a'>Support:</span> " +
        "<span class='level'>" + (supports || "N/A") + "</span></div>" +
        "<div>Тренд: <b>" + ((pairData.trend || "unknown").toUpperCase()) + "</b></div>" +
        "</div>";

    html += "<div class='section'>" +
        "<div class='section-title'>Обоснование</div>" +
        "<div>" + (pairData.reasoning || "Нет обоснования.") + "</div>" +
        "</div>";

    // Накопленный контекст
    const accCtx = lastBriefingData.accumulated_context || {};
    const pairCtx = accCtx[displaySymbol(currentSymbol)];
    if (pairCtx && pairCtx.length > 0) {
        html += "<div class='section'>" +
            "<div class='section-title'>Накопленный контекст</div><ul style='color:#aaa;font-size:11px'>" +
            pairCtx.map(function(c) { return "<li>" + c + "</li>"; }).join("") +
            "</ul></div>";
    }

    html += "<div class='section'>" +
        "<div class='section-title'>На что обратить внимание</div>" +
        "<div>" + (pairData.watch_for || "Ничего конкретного.") + "</div>" +
        "</div>";

    if (pairData.key_events && pairData.key_events.length > 0) {
        html += "<div class='section'>" +
            "<div class='section-title'>Ожидаемые новости</div><ul>" +
            pairData.key_events.map(function(e) { return "<li>" + e + "</li>"; }).join("") +
            "</ul></div>";
    }

    if (globalCtx.risk_factors && globalCtx.risk_factors.length > 0) {
        html += "<div class='section'>" +
            "<div class='section-title'>Факторы риска</div><ul>" +
            globalCtx.risk_factors.map(function(r) {
                return "<li style='color:#ff8a80'>⚠️ " + r + "</li>";
            }).join("") +
            "</ul></div>";
    }

    if (globalCtx.recommendation) {
        html += "<div class='section'>" +
            "<div class='section-title'>Рекомендация</div>" +
            "<div>" + globalCtx.recommendation + "</div>" +
            "</div>";
    }

    // Трек-рекорд «кто чаще прав» — общий для всех пар, внизу брифинга.
    const tr = lastBriefingData.track_record;
    if (tr && (tr.deepseek?.total || tr.consensus?.total)) {
        const pct = function(x) {
            return x.total ? Math.round(100 * x.hit / x.total) + "%" : "—";
        };
        html += "<div class='section' style='border-top:1px solid var(--divider);padding-top:8px'>" +
            "<div class='section-title'>Трек-рекорд (7 дней)</div>" +
            "<div style='font-size:12px'>" +
            "Аналитики: <b>" + tr.consensus.hit + "/" + tr.consensus.total +
            "</b> (" + pct(tr.consensus) + ")<br>" +
            "🤖 DeepSeek: <b>" + tr.deepseek.hit + "/" + tr.deepseek.total +
            "</b> (" + pct(tr.deepseek) + ")";
        if (tr.disagreements) {
            html += "<br><span style='color:#aaa'>Расхождений: " + tr.disagreements +
                ", из них DeepSeek прав в " + tr.disagree_ds_right + "</span>";
        }
        html += "</div></div>";
    }

    content.innerHTML = html;
}

// ============================================================================
// ВСПЛЕСКИ (shock) — сигнальщик по четырём форекс-парам
// ============================================================================
//
// Хаб считает всплеск по ЗАКРЫТОЙ M1: диапазон свечи против её же последних 30
// (z-score), пороги у каждой пары свои (USD/JPY 8σ, AUD/USD 5σ, USD/CAD 4.5σ —
// это их p99.9 за две недели). EUR/USD — ведущая: сама сигналов не даёт, но
// обязана быть спокойной, иначе всплеск — общий долларовый импульс, а не
// событие пары.
//
// Всплеск в окне тишины (сессия ±30 мин, новости ±15 мин) НЕ звучит и не
// всплывает, но маркер ставится серым — владелец просил видеть индикацию всё
// время ограничения.
//
// ВАЖНО: маркер отмечает необычную свечу, направление он НЕ предсказывает —
// бэктест разворота эджа не дал (42.9% против базовых 52.0%).

// Цвет маркеров всплеска. Между голубым и синим (azure): заметен и на светлой,
// и на тёмной теме, и НЕ совпадает с зелёным/красным свечей — маркер про место
// события, а не про направление.
const SHOCK_MARKER_COLOR = "#1E88E5";

// Сколько бейдж окна тишины живёт, если конец окна неизвестен. Сессионные
// окна приходят без until_ts (у них ±30 мин от фиксированного времени, и
// хаб конец не считает), поэтому нужен собственный срок годности — иначе
// бейдж висел бы до следующего сигнала, то есть часами.
const SHOCK_BADGE_MAX_AGE = 30 * 60 * 1000;

// Активные окна тишины по инструментам: symbol -> {kind, label, until_ts,
// seen_ts}. seen_ts проставляем сами: у сессионных окон хаб не присылает
// until_ts, и без отметки времени такое окно нельзя признать просроченным.
const shockWindowState = new Map();

/**
 * Запомнить окно тишины инструмента, проставив время получения.
 *
 * @param {string} symbol Инструмент.
 * @param {Object|null} blocked Окно из хаба или null.
 */
function rememberShockWindow(symbol, blocked) {
    if (!blocked) { shockWindowState.delete(symbol); return; }
    shockWindowState.set(symbol, Object.assign({}, blocked, {seen_ts: Date.now()}));
}

/**
 * Взять окно тишины инструмента, ЕСЛИ оно ещё действует.
 *
 * Просроченное окно не просто не показывается — оно удаляется. Иначе любая
 * перерисовка (приход истории, ответ get_shocks) доставала бы его снова и
 * заново взводила бейдж: надпись «сигналы подавлены» висела бесконечно.
 *
 * @param {string} symbol Инструмент.
 * @returns {Object|null} Действующее окно либо null.
 */
function activeShockWindow(symbol) {
    const blocked = shockWindowState.get(symbol);
    if (!blocked) return null;

    const now = Date.now();
    const expired = (typeof blocked.until_ts === "number")
        ? blocked.until_ts * 1000 <= now
        : (now - (blocked.seen_ts || 0)) >= SHOCK_BADGE_MAX_AGE;
    if (expired) { shockWindowState.delete(symbol); return null; }
    return blocked;
}

// Журнал всплесков для панели: живые события + ответ на get_shocks.
// Живёт только в памяти вкладки; источник истины — хаб (окно суток).
const shockLog = [];
let shockPanelOpen = false;

/**
 * Добавить событие в журнал панели, не плодя дублей.
 *
 * Сигнал приходит по ЖИВОЙ свече и может обновиться на закрытии (σ уточняется),
 * поэтому запись той же минуты обновляется на месте.
 * @param {Object} ev Событие всплеска.
 */
function recordShock(ev) {
    const i = shockLog.findIndex(s => s.time === ev.time && s.symbol === ev.symbol);
    if (i >= 0) shockLog[i] = ev;
    else shockLog.push(ev);
    shockLog.sort((a, b) => b.time - a.time);   // свежие сверху
    if (shockLog.length > 200) shockLog.length = 200;
}

/**
 * Восстановить журнал панели из сохранённых маркеров.
 *
 * Маркеры лежат в localStorage и переживают F5, а `shockLog` — нет: он живёт
 * в памяти вкладки. Журнал хаба тоже в памяти и обнуляется его рестартом.
 * Без этого после перезагрузки маркеры на графике были, а панель писала
 * «Сигналов нет» — прямая ложь при наличии данных под рукой.
 *
 * Берём рисунки ОБЕИХ панелей и все инструменты из layout: журнал по смыслу
 * общий, а не привязан к тому, что открыто сейчас.
 */
function restoreShockLogFromDrawings() {
    const seen = new Set(shockLog.map(s => s.time + "|" + s.symbol));

    const absorb = (symbol, list) => {
        (list || []).forEach(d => {
            if (d.type !== "shock") return;
            const key = d.time + "|" + symbol;
            if (seen.has(key)) return;
            seen.add(key);
            shockLog.push({
                symbol,
                time: d.time,
                price: d.price,
                direction: d.direction,
                sigma: d.sigma,
                blocked: d.blocked || null,
                shape: d.shapeKind || null,
                coverage: d.coverage ?? null,
                origin: d.origin || null,
                audible: !!d.audible,
            });
        });
    };

    // Текущие панели — самые свежие данные.
    [1, 2].forEach(paneId => absorb(currentSymbol, drawings[paneId]));

    // Остальные инструменты — из сохранённого layout.
    const saved = layout.drawings || {};
    Object.keys(saved).forEach(symbol => {
        const perPane = saved[symbol] || {};
        Object.keys(perPane).forEach(paneId => absorb(symbol, perPane[paneId]));
    });

    shockLog.sort((a, b) => b.time - a.time);
    if (shockLog.length > 200) shockLog.length = 200;
}

/**
 * Повторять привязку маркера, пока панель не будет готова.
 *
 * @param {Object} ev Событие всплеска.
 * @param {number} tries Сколько попыток осталось (по ~300 мс).
 */
function retryAttachShock(ev, tries) {
    if (tries <= 0) return;
    // Инструмент могли переключить, пока ждали — событие тогда уже не наше.
    if (displaySymbol(ev.symbol) !== displaySymbol(currentSymbol)) return;
    if (attachShockToPanes(ev)) {
        refreshShockMarkers();
        return;
    }
    setTimeout(() => retryAttachShock(ev, tries - 1), 300);
}

/**
 * Досоздать маркеры для событий журнала, которых нет на панелях.
 *
 * Зеркало restoreShockLogFromDrawings(). Нужна, потому что сигнал может
 * прийти в момент, когда панель ещё не готова (`series`/`chart` не созданы
 * при старте или после смены инструмента) — тогда attachShockToPanes её
 * пропускает, событие остаётся только в журнале, и маркер не появляется до
 * ручной перерисовки.
 */
function syncShockMarkersFromLog() {
    shockLog.forEach(s => {
        if (displaySymbol(s.symbol) !== displaySymbol(currentSymbol)) return;
        attachShockToPanes(s);
    });
}

/**
 * Перерисовать панель всплесков, если она открыта.
 */
function renderShockPanel() {
    const panel = document.getElementById("shockPanel");
    if (!panel || !shockPanelOpen) return;

    const head =
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
          '<b style="font-size:17px;">Сигналы — всплески</b>' +
          '<span style="flex:1"></span>' +
          '<span onclick="toggleShockPanel()" style="cursor:pointer;color:#888;' +
                'font-weight:bold;padding:0 4px;font-size:17px;">✕</span>' +
        '</div>';

    // Что именно показывает движок — иначе пустой список неотличим от поломки.
    const thresholds = 'USD/JPY 6σ · AUD/USD 4.5σ · USD/CAD 4.5σ';

    let body;
    if (!shockLog.length) {
        body =
            '<div style="color:#888;font-size:15px;line-height:1.6;">' +
              'Сигналов нет.<br>' +
              '<span style="color:#666;font-size:14px;">' +
                'Движок работает и ждёт всплеск: диапазон свечи M1 против своих ' +
                'последних 30.<br>Пороги: ' + thresholds + '.<br>' +
                '<span style="color:#ffb74d">⚡ рывок</span> — ≥70% размаха за 10 с, ' +
                'звучит · <span style="color:#8a8a8a">〜 размазан</span> — молча в список.<br>' +
                '<b>SOLO</b> — двинулась только эта пара · <b>IN STREAM</b> — ' +
                'общее движение доллара (EUR/USD шёл вместе).<br>' +
                'Ожидаемо ~11 событий в сутки, из них со звуком ~4–5.' +
              '</span>' +
            '</div>';
    } else {
        const rows = shockLog.map((s, idx) => {
            const up    = s.direction > 0;
            const color = s.blocked ? "#787b86" : (up ? "#26a69a" : "#ef5350");
            const arrow = up ? "▲" : "▼";
            const d     = new Date(s.time * 1000);
            const when  = d.toISOString().slice(5, 16).replace("T", " ");
            const note  = s.blocked
                ? '<div style="font-size:13px;color:#7a6a3a;">подавлен: ' +
                  (s.blocked.kind === "news" ? "новости" : "сессия") + ' — ' +
                  s.blocked.label + '</div>'
                : '';
            // Форма: рывок за ≤10 с против размазанного движения. Не фильтр —
            // оба вида в списке, но с разной пометкой.
            const cov = s.coverage != null ? Math.round(s.coverage * 100) + '%' : '';
            const shapeNote = s.shape === "burst"
                ? '<div style="font-size:13px;color:#ffb74d;">⚡ рывок за 10 с — ' +
                  cov + ' размаха</div>'
                : (s.shape === "spread"
                    ? '<div style="font-size:13px;color:#8a8a8a;">〜 движение размазано — ' +
                      'лучшие 10 с дали ' + cov + '</div>'
                    : '');
            // SOLO выделен цветом: он означает, что двинулась именно эта пара,
            // а не весь доллар — самое содержательное различие в списке.
            const badge = s.origin === "solo"
                ? '<span style="background:#1b5e20;color:#a5d6a7;padding:0 4px;' +
                  'border-radius:3px;font-size:12px;font-weight:bold;">SOLO</span> '
                : (s.origin === "in_stream"
                    ? '<span style="background:#37474f;color:#b0bec5;padding:0 4px;' +
                      'border-radius:3px;font-size:12px;">IN STREAM</span> '
                    : '');
            // Молча прошедшие события помечаем, чтобы не искать, почему не было звука.
            const silent = (!s.audible && !s.blocked)
                ? '<span style="color:#555;font-size:12px;"> (без звука)</span>' : '';
            return (
                '<div onclick="gotoShock(' + idx + ')" ' +
                     'style="padding:8px 10px;border-radius:4px;cursor:pointer;' +
                            'border-left:3px solid ' + color + ';background:#00000022;' +
                            'margin-bottom:4px;" ' +
                     'onmouseover="this.style.background=\'#ffffff14\'" ' +
                     'onmouseout="this.style.background=\'#00000022\'">' +
                  '<div style="font-size:15px;">' +
                    '<span style="color:' + color + '">' + arrow + '</span> ' +
                    '<b>' + s.symbol + '</b> ' +
                    '<span style="color:#aaa">' + s.sigma.toFixed(1) + 'σ</span> ' +
                    '<span style="color:#666;font-size:14px;">' + when + ' UTC</span>' +
                    silent +
                  '</div>' +
                  '<div style="margin-top:3px;">' + badge + '</div>' +
                  shapeNote + note +
                '</div>');
        }).join("");
        body = '<div style="max-height:420px;overflow-y:auto;">' + rows + '</div>' +
               '<div style="font-size:13px;color:#666;margin-top:8px;">' +
                 'клик — перейти к свече · ' + thresholds +
               '</div>';
    }

    panel.innerHTML = head + body;
    panel.style.display = "block";
}

/**
 * Открыть/закрыть панель всплесков (кнопка «Сигналы»).
 */
function toggleShockPanel() {
    const panel = document.getElementById("shockPanel");
    const btn   = document.getElementById("signalLogBtn");
    shockPanelOpen = !shockPanelOpen;

    if (shockPanelOpen) {
        // Сначала поднимаем то, что уже сохранено локально: после F5 маркеры
        // на графике есть, и панель обязана показывать их, а не «сигналов нет».
        restoreShockLogFromDrawings();
        // Журнал хаба может быть полнее локального: другая вкладка, F5.
        // Достаточно ЛЮБОГО живого сокета — журнал общий, не по панелям;
        // первая панель могла быть закрыта или переподключаться.
        const ws = [1, 2]
            .map(id => panesState[id]?.ws)
            .find(s => s && s.readyState === WebSocket.OPEN);
        if (ws) {
            try { ws.send(JSON.stringify({ type: "get_shocks" })); } catch (e) {}
        }
        if (btn) btn.classList.add("on");
        renderShockPanel();
    } else {
        if (btn) btn.classList.remove("on");
        if (panel) panel.style.display = "none";
    }
}

/**
 * Перейти к свече сигнала: инструмент, затем центрирование графика.
 *
 * @param {number} idx Индекс в shockLog.
 */
function gotoShock(idx) {
    const s = shockLog[idx];
    if (!s) return;
    jumpToShock(s);
}

/**
 * Прыгнуть на пару и свечу сигнала.
 *
 * Общий путь для клика по строке панели/попапу и для автоперехода
 * (onShockEvent): разница только в том, кто вызывает.
 *
 * @param {Object} ev Событие всплеска.
 */
function jumpToShock(ev) {
    // Сравниваем БЕЗ префикса провайдера: хаб шлёт символ в wire-формате
    // клиента, и "fxcm:AUD/USD" против "AUD/USD" — тот же инструмент. Без
    // нормализации был бы лишний полный switchSymbol с перезагрузкой истории
    // вместо простого центрирования.
    if (displaySymbol(ev.symbol) !== displaySymbol(currentSymbol)) {
        switchSymbol(ev.symbol);
        // История нового инструмента приходит асинхронно — центрируем и
        // ставим маркер, когда бары действительно на графике, иначе
        // setVisibleRange отработает по пустой серии и ничего не сдвинет.
        centerOnShockWhenReady(ev, 12);
    } else {
        centerOnTime(ev.time);
        // Маркер мог не существовать: событие по ЧУЖОМУ инструменту при
        // получении отбрасывалось (панели показывают только currentSymbol),
        // и после переключения его никто не создавал — маркер появлялся лишь
        // со второго клика по строке.
        attachShockToPanes(ev);
        refreshShockMarkers();
    }
}

/**
 * Переключить автопереход по сигналу и сохранить в layout.
 */
function toggleAutoJump() {
    layout.autoJump = !layout.autoJump;
    StorageLayer.autoSave(layout);
    syncAutoJumpBtn();
}

/**
 * Отразить состояние автоперехода на кнопке (акцент = включён).
 */
function syncAutoJumpBtn() {
    const btn = document.getElementById("autoJumpBtn");
    if (!btn) return;
    if (layout.autoJump) btn.classList.add("on");
    else btn.classList.remove("on");
}

/**
 * Привязать событие к панелям текущего инструмента (создать/обновить маркер).
 *
 * @param {Object} ev Событие всплеска (живое или из журнала).
 * @returns {boolean} true, если хоть одна панель приняла маркер.
 */
function attachShockToPanes(ev) {
    if (!ev || typeof ev.time !== "number") return false;
    // Панели всегда показывают currentSymbol — отдельного st.symbol в проекте
    // нет. Сравнение БЕЗ префикса провайдера: хаб шлёт wire-имя клиента.
    if (displaySymbol(ev.symbol) !== displaySymbol(currentSymbol)) return false;

    // Успех — только когда маркер лёг на ВСЕ панели, которые вообще существуют
    // в текущей раскладке. Возврат по принципу «хотя бы одна» скрывал случай,
    // когда первая панель готова, а вторая ещё грузится: ретрай считал работу
    // сделанной, и на второй панели маркера не появлялось.
    let attached = true;
    [1, 2].forEach(paneId => {
        const st = panesState[paneId];
        // Панели нет в раскладке вовсе — не наша забота.
        if (!st) return;
        if (!st.series) { attached = false; return; }
        drawings[paneId] = drawings[paneId] || [];
        // Сигнал приходит по ЖИВОЙ свече; направление, σ и форма у неё ещё
        // уточняются до закрытия минуты — запись той же минуты обновляем
        // на месте, а не плодим вторую.
        const existing = drawings[paneId].find(
            d => d.type === "shock" && d.time === ev.time);
        if (existing) {
            existing.price     = ev.price;
            existing.high      = ev.high ?? existing.high ?? null;
            existing.low       = ev.low ?? existing.low ?? null;
            existing.direction = ev.direction;
            existing.sigma     = ev.sigma;
            existing.blocked   = ev.blocked || null;
            existing.shapeKind = ev.shape || existing.shapeKind || null;
            existing.coverage  = ev.coverage ?? existing.coverage ?? null;
            existing.origin    = ev.origin || existing.origin || null;
            existing.audible   = !!ev.audible;
        } else {
            drawings[paneId].push({
                paneId,
                type: "shock",
                time: ev.time,
                price: ev.price,
                high: ev.high ?? null,
                low: ev.low ?? null,
                direction: ev.direction,
                sigma: ev.sigma,
                blocked: ev.blocked || null,
                shapeKind: ev.shape || null,
                coverage: ev.coverage ?? null,
                origin: ev.origin || null,
                audible: !!ev.audible,
            });
        }
        StorageLayer.saveDrawings(paneId, layout, panesState, drawings);
    });
    return attached;
}

/**
 * Центрировать ВСЕ видимые панели на времени свечи.
 *
 * При сплите обе панели показывают один инструмент, и промотать надо обе —
 * иначе вторую приходится крутить руками. ТФ у панелей разные, поэтому окно
 * считается для каждой отдельно.
 *
 * @param {number} time Unix-время свечи.
 * @returns {boolean} true, если центрирование удалось хотя бы на одной.
 */
function centerOnTime(time) {
    let done = false;
    [1, 2].forEach(paneId => {
        const st = panesState[paneId];
        if (!st?.chart || !st.data?.length) return;
        // Показать окрестность свечи, а не одну её: контекст важнее точности.
        const span = (st.tfSeconds || 60) * 60;
        try {
            st.chart.timeScale().setVisibleRange({ from: time - span, to: time + span });
            done = true;
        } catch (e) { /* панель могла быть скрыта или ещё без данных */ }
    });
    return done;
}

/**
 * Дождаться загрузки истории, центрировать графики и поставить маркер.
 *
 * История нового инструмента приходит асинхронно, поэтому и центрирование,
 * и маркер делаются здесь: на момент switchSymbol серия ещё пуста, а
 * `drawings` только что очищены сменой инструмента.
 *
 * @param {Object} ev Событие всплеска, к которому переходим.
 * @param {number} tries Сколько попыток осталось (по ~250 мс).
 */
function centerOnShockWhenReady(ev, tries) {
    if (tries <= 0) return;
    if (centerOnTime(ev.time)) {
        attachShockToPanes(ev);
        refreshShockMarkers();
        return;
    }
    setTimeout(() => centerOnShockWhenReady(ev, tries - 1), 250);
}

/**
 * Показать кликабельное уведомление о всплеске.
 *
 * По клику переключает терминал на инструмент, с которого пришёл сигнал.
 * @param {Object} ev Событие всплеска от хаба.
 */
function showShockPopup(ev) {
    const popup = document.getElementById("shockPopup");
    if (!popup) return;

    const up    = ev.direction > 0;
    const color = up ? "#26a69a" : "#ef5350";
    const arrow = up ? "▲" : "▼";
    const time  = new Date(ev.time * 1000).toISOString().slice(11, 16);

    // Форма: «рывок» — почти весь размах минуты сделан за ≤10 секунд;
    // «размазан» — движение шло равномерно. Оба звучат, но это разные события.
    const shapeLabel = ev.shape === "burst"
        ? '⚡ рывок' + (ev.coverage ? ' ' + Math.round(ev.coverage * 100) + '%' : '')
        : (ev.shape === "spread"
            ? '〜 размазан' + (ev.coverage ? ' ' + Math.round(ev.coverage * 100) + '%' : '')
            : '');

    // Происхождение: SOLO — двинулась только эта пара, IN STREAM — её несло
    // общим движением доллара (EUR/USD шёл вместе с ней).
    const originBadge = ev.origin === "solo"
        ? '<span style="background:#1b5e20;color:#a5d6a7;padding:1px 5px;' +
          'border-radius:3px;font-size:10px;font-weight:bold;">SOLO</span>'
        : (ev.origin === "in_stream"
            ? '<span style="background:#37474f;color:#b0bec5;padding:1px 5px;' +
              'border-radius:3px;font-size:10px;">IN STREAM</span>'
            : '');

    popup.style.borderLeftColor = color;
    popup.innerHTML =
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div style="flex:1;">' +
            '<div style="font-weight:bold;font-size:13px;">' +
              '<span style="color:' + color + '">' + arrow + '</span> ' +
              ev.symbol + ' — всплеск ' + ev.sigma.toFixed(1) + 'σ' +
              (shapeLabel ? ' <span style="font-weight:normal;font-size:11px;color:' +
                            (ev.shape === "burst" ? "#ffb74d" : "#8a8a8a") + '">' +
                            shapeLabel + '</span>' : '') +
            '</div>' +
            '<div style="margin-top:4px;">' + originBadge + '</div>' +
            '<div style="font-size:11px;color:#aaa;margin-top:3px;">' +
              time + ' UTC · порог ' + ev.threshold + 'σ · EUR/USD ' +
              (ev.leader_sigma == null ? 'н/д' : ev.leader_sigma.toFixed(1) + 'σ') +
            '</div>' +
            '<div style="font-size:10px;color:#777;margin-top:3px;">' +
              'нажмите, чтобы перейти к инструменту' +
            '</div>' +
          '</div>' +
          '<span id="closeShock" style="cursor:pointer;font-weight:bold;' +
                'color:#888;padding:0 4px;">✕</span>' +
        '</div>';
    popup.style.display = "block";

    // Клик по телу — переход на инструмент сигнала; по крестику — только закрыть.
    popup.onclick = () => {
        // Тот же нормализованный сравниватель, что и в gotoShock: префикс
        // провайдера не делает инструмент другим.
        if (ev.symbol && displaySymbol(ev.symbol) !== displaySymbol(currentSymbol))
            switchSymbol(ev.symbol);
        popup.style.display = "none";
    };
    const close = document.getElementById("closeShock");
    if (close) close.onclick = (e) => {
        e.stopPropagation();
        popup.style.display = "none";
    };

    clearTimeout(popup._hideTimer);
    popup._hideTimer = setTimeout(() => { popup.style.display = "none"; }, 20000);
}

// Таймер, гасящий бейдж, когда окно кончилось.
let _shockBadgeTimer = null;

/**
 * Обновить бейдж окна тишины для текущего инструмента.
 *
 * Бейдж САМОГАСЯЩИЙСЯ. Он ставился по событию всплеска и снимался только
 * следующим событием с blocked=null — а сигналов может не быть часами, и
 * надпись «сигналы подавлены» висела уже после конца окна, вводя в
 * заблуждение. Теперь окно снимается по времени: по until_ts, если хаб его
 * прислал (новости), иначе через SHOCK_BADGE_MAX_AGE.
 *
 * @param {Object|null} blocked Окно из хаба ({kind,label,until_ts}) или null.
 */
function renderShockWindowBadge(blocked) {
    const badge = document.getElementById("shockWindowBadge");
    if (!badge) return;

    clearTimeout(_shockBadgeTimer);
    _shockBadgeTimer = null;

    if (!blocked) { badge.style.display = "none"; return; }

    // Окно с известным концом, который уже прошёл, показывать незачем.
    const now = Date.now();
    let msLeft = SHOCK_BADGE_MAX_AGE;
    if (typeof blocked.until_ts === "number") {
        msLeft = blocked.until_ts * 1000 - now;
        if (msLeft <= 0) {
            shockWindowState.delete(currentSymbol);
            badge.style.display = "none";
            return;
        }
    }

    const isNews = blocked.kind === "news";
    badge.textContent = (isNews ? "📰 новости: " : "🕐 сессия: ") + blocked.label +
                        " — сигналы подавлены";
    badge.style.background = isNews ? "#7a4b00" : "#3a3a3a";
    badge.style.display = "block";

    // Гасим сами, не дожидаясь следующего сигнала. Состояние чистит
    // activeShockWindow при первом же обращении после срока, поэтому здесь
    // достаточно перерисовать: если окно истекло, оно вернёт null.
    _shockBadgeTimer = setTimeout(() => {
        renderShockWindowBadge(activeShockWindow(currentSymbol));
    }, Math.min(msLeft, SHOCK_BADGE_MAX_AGE) + 50);
}

/**
 * Отступ маркера от свечи в единицах цены инструмента.
 *
 * Считается от размаха ВИДИМЫХ баров, поэтому выглядит одинаково на EUR/USD
 * и USD/JPY, где цены отличаются в сотни раз. Пересчитывается на каждой
 * перерисовке — при зуме масштаб меняется.
 *
 * @param {number} paneId Панель.
 * @returns {number} Отступ в единицах цены; 0, если измерить не удалось.
 */
function shockMarkerGap(paneId) {
    const st = panesState[paneId];
    if (!st?.data?.length) return 0;
    // Хвоста видимых баров достаточно: маркеры живут в свежей истории.
    const tail = st.data.slice(-120);
    let hi = -Infinity, lo = Infinity;
    for (const c of tail) {
        const h = c.high ?? c.close;
        const l = c.low  ?? c.close;
        if (h != null && h > hi) hi = h;
        if (l != null && l < lo) lo = l;
    }
    if (!isFinite(hi) || !isFinite(lo) || hi <= lo) return 0;
    return (hi - lo) * 0.04;   // ~4% видимого диапазона
}

/**
 * Собрать маркеры всплесков для панели из сохранённых рисунков.
 *
 * @param {number} paneId Панель.
 * @returns {Array} Маркеры для createSeriesMarkers, отсортированные по времени.
 */
function getShockMarkersForPane(paneId) {
    return (drawings[paneId] || [])
        .filter(d => d.type === "shock")
        .flatMap(d => {
            // Свеча берётся В ВИЛКУ: стрелка сверху смотрит вниз, снизу —
            // вверх, обе указывают на неё. Одна стрелка «от свечи» читалась
            // как направление движения и путала.
            //
            // Цвет один для всех: направление и форма всплеска видны в панели,
            // на графике маркер только показывает МЕСТО. Подавленный окном
            // тишины приглушён — событие было, но сигналом не считалось.
            const color = d.blocked ? "#5a7a99" : SHOCK_MARKER_COLOR;
            const gap = shockMarkerGap(paneId);
            const hi = d.high ?? d.price;
            const lo = d.low ?? d.price;

            const top = {
                time:  d.time,
                color: color,
                shape: "arrowDown",     // сверху вниз — указывает на свечу
                size:  1.5,
                id:    "shock-top-" + d.time,
            };
            const bottom = {
                time:  d.time,
                color: color,
                shape: "arrowUp",       // снизу вверх — указывает на свечу
                size:  1.5,
                id:    "shock-bot-" + d.time,
            };

            // Отступ от свечи. У aboveBar/belowBar зазор фиксирован и мелкий —
            // маркер налезает на тело. Позиции atPrice* (LWC 5.0.4+) принимают
            // цену, и отступ задаётся в долях ВИДИМОГО диапазона: в пунктах он
            // был бы разным у EUR/USD и USD/JPY (цены различаются в 130 раз).
            if (hi != null && lo != null && gap > 0) {
                top.position    = "atPriceTop";
                top.price       = hi + gap;
                bottom.position = "atPriceBottom";
                bottom.price    = lo - gap;
            } else {
                // Нет цены или не удалось измерить масштаб — обычное поведение.
                top.position    = "aboveBar";
                bottom.position = "belowBar";
            }
            return [top, bottom];
        })
        .sort((a, b) => a.time - b.time);
}

/**
 * Перерисовать маркеры всплесков на обеих панелях.
 *
 * Маркеры сигналов и всплесков живут в РАЗНЫХ плагинах: один слой на серию
 * перезаписывался бы целиком, и вторая группа маркеров пропадала бы.
 */
function refreshShockMarkers() {
    [1, 2].forEach(paneId => {
        const st = panesState[paneId];
        if (!st?.series) return;
        const markers = getShockMarkersForPane(paneId);
        try {
            if (!st.shockMarkers) {
                st.shockMarkers = LightweightCharts.createSeriesMarkers(st.series, markers);
            } else {
                st.shockMarkers.setMarkers(markers);
            }
        } catch (e) { console.error("shock markers failed:", e); }
    });
}

/**
 * Принять всплеск от хаба: маркер, звук, уведомление.
 *
 * @param {Object} ev Сообщение хаба типа "shock".
 */
function onShockEvent(ev) {
    if (!ev || typeof ev.time !== "number") return;

    recordShock(ev);
    renderShockPanel();
    rememberShockWindow(ev.symbol, ev.blocked || null);
    if (ev.symbol === currentSymbol) renderShockWindowBadge(ev.blocked || null);

    // Автопереход: когда включён и сигнал звучит (рывок вне окна тишины) —
    // сразу переключаемся на его пару и свечу, чтобы успеть войти руками.
    // Размазанные события и подавленные окном в журнале, но график не
    // дёргают: их ~11 в сутки против ~5 звучащих, и каждый увод от текущей
    // пары — потеря контекста. Выключено — поведение как раньше.
    if (layout.autoJump && ev.audible) {
        jumpToShock(ev);
    }

    // Маркер ставим ТОЛЬКО на панели с этим инструментом: на чужом графике
    // время свечи чужое, маркер повис бы в случайной точке. Событие остаётся
    // в журнале, и маркер появится после перехода по нему из панели.
    const attached = attachShockToPanes(ev);
    refreshShockMarkers();

    // Панель могла быть ещё не готова (series/chart не созданы) — тогда
    // маркера нет, хотя событие в журнале есть. Повторяем короткой серией
    // попыток, чтобы маркер появился сам, без нажатия кнопки.
    if (!attached && displaySymbol(ev.symbol) === displaySymbol(currentSymbol)) {
        retryAttachShock(ev, 20);
    }

    // Звучат только РЫВКИ вне окон тишины — решение принимает хаб (audible).
    // Размазанные события и подавленные окном остаются в панели и на графике,
    // но молча: без блокировки по ведущей их стало слишком много для звука.
    if (!ev.audible) return;
    playAlertSound();
    showShockPopup(ev);
}

// ============================================================================
// FIBONACCI — сетка уровней
// ============================================================================
//
// Сетка задаётся ДВУМЯ точками: p1 = 0%, p2 = 100%. Цена уровня считается как
// p1 + (p2 - p1) * value, поэтому значения > 1 (1.272 / 1.618) — это проекции
// ЗА вторую точку, а отрицательные ушли бы до первой. Так же считает TradingView.
//
// Каждый уровень — самостоятельный объект {value, color, visible}: цвет свой у
// каждой линии, любую можно погасить, а список пополняется своими уровнями.

const FIB_DEFAULT_LEVELS = [
    { value: 0,     color: "#787b86", visible: true },
    { value: 0.236, color: "#f23645", visible: true },
    { value: 0.382, color: "#ff9800", visible: true },
    { value: 0.5,   color: "#4caf50", visible: true },
    { value: 0.618, color: "#089981", visible: true },
    { value: 0.786, color: "#00bcd4", visible: true },
    { value: 1,     color: "#787b86", visible: true },
    { value: 1.272, color: "#2962ff", visible: false },
    { value: 1.618, color: "#9c27b0", visible: false },
];
// storage.js — отдельный файл и не видит модульных констант: отдаём дефолт
// через window, он нужен там как подстраховка при восстановлении.
window.FIB_DEFAULT_LEVELS = FIB_DEFAULT_LEVELS;

/**
 * Создать объект сетки Фибоначчи по двум точкам.
 *
 * Уровни копируются из FIB_DEFAULT_LEVELS, чтобы правка одной сетки не меняла
 * остальные и дефолт.
 * @param {number} paneId Панель.
 * @param {{time:number, price:number}} p1 Точка 0%.
 * @param {{time:number, price:number}} p2 Точка 100%.
 * @returns {Object} Объект рисунка типа "fib".
 */
function makeFib(paneId, p1, p2) {
    return {
        type: "fib",
        paneId,
        points: [p1, p2],
        levels: FIB_DEFAULT_LEVELS.map(l => ({ ...l })),
        color: "#787b86",
        width: 1,
        extendRight: true,
        showFill: false,
        priceDecimals: instrumentPrecision[currentSymbol]?.precision ?? 5,
        selected: false
    };
}

const IND_DEFAULTS = {
    sma:        { params: { period: 20 },                          color: '#2962FF' },
    ema:        { params: { period: 21 },                          color: '#ff9800' },
    bollinger:  { params: { period: 20, mult: 2 },                 color: '#9c27b0' },
    rsi:        { params: { period: 14 },                          color: '#e91e63' },
    macd:       { params: { fast: 12, slow: 26, signal: 9 },       color: '#2962FF' },
    stochastic: { params: { period: 14, smoothK: 3, smoothD: 3 },  color: '#2962FF' },
    atr:        { params: { period: 14 },                          color: '#26c6da' },
};
const IND_LABELS = { sma: 'SMA', ema: 'EMA', bollinger: 'Bollinger', rsi: 'RSI', macd: 'MACD', stochastic: 'Stoch', atr: 'ATR' };

let _indSettingsTarget = null; // { paneId, instanceId }
let _indSettingsLineWidth = 2;

function saveIndicators(paneId) {
    const mgr = panesState[paneId]?.indicatorManager;
    if (!mgr) return;
    if (!layout.indicators) layout.indicators = {};
    layout.indicators[paneId] = mgr.serialize();
    StorageLayer.autoSave(layout);
}

function renderIndicatorList(paneId) {
    const mgr = panesState[paneId]?.indicatorManager;
    const list = document.getElementById('indList');
    if (!list) return;
    if (!mgr || !mgr.getInstances().length) {
        list.innerHTML = '<div style="color:#aaa;font-size:11px;padding:4px 0;">No indicators added</div>';
        return;
    }
    list.innerHTML = mgr.getInstances().map(inst => {
        const label = IND_LABELS[inst.type] || inst.type;
        const paramStr = _instParamStr(inst);
        return `<div class="ind-row">
            <span class="ind-swatch" style="background:${inst.color};"></span>
            <span class="ind-name">${label}${paramStr}</span>
            <button class="ind-settings-btn" onclick="openIndSettings('${inst.id}',${paneId},this,event)">⚙</button>
            <button class="ind-del-btn" onclick="removeIndicator('${inst.id}',${paneId})">✕</button>
        </div>`;
    }).join('');
}

function _instParamStr(inst) {
    const p = inst.params;
    if (inst.type === 'sma' || inst.type === 'ema') return `(${p.period})`;
    if (inst.type === 'bollinger') return `(${p.period},${p.mult})`;
    if (inst.type === 'rsi') return `(${p.period})`;
    if (inst.type === 'macd') return `(${p.fast},${p.slow},${p.signal})`;
    if (inst.type === 'stochastic') return `(${p.period},${p.smoothK},${p.smoothD})`;
    if (inst.type === 'atr') return `(${p.period})`;
    return '';
}

function toggleAddIndDropdown(e) {
    e.stopPropagation();
    const dd = document.getElementById('addIndDropdown');
    if (dd.style.display === 'block') { dd.style.display = 'none'; return; }
    dd.innerHTML = Object.keys(IND_DEFAULTS).map(type =>
        `<button onclick="addIndicator('${type}',${indicatorPanelPane})">${IND_LABELS[type]}</button>`
    ).join('');
    dd.style.display = 'block';
}

function addIndicator(type, paneId) {
    document.getElementById('addIndDropdown').style.display = 'none';
    const mgr  = panesState[paneId]?.indicatorManager;
    const data = panesState[paneId]?.data;
    if (!mgr) return;
    const def = IND_DEFAULTS[type];
    mgr.add(type, { ...def.params }, def.color, 2);
    if (data?.length) mgr.recomputeAll(data);
    renderIndicatorList(paneId);
    saveIndicators(paneId);
}

function removeIndicator(id, paneId) {
    const mgr  = panesState[paneId]?.indicatorManager;
    const data = panesState[paneId]?.data;
    if (!mgr) return;
    mgr.remove(id);
    if (data?.length) mgr.recomputeAll(data);
    renderIndicatorList(paneId);
    saveIndicators(paneId);
}

function openIndSettings(instanceId, paneId, btnEl, e) {
    if (e) e.stopPropagation();
    const mgr  = panesState[paneId]?.indicatorManager;
    if (!mgr) return;
    const inst = mgr.getInstances().find(i => i.id === instanceId);
    if (!inst) return;

    _indSettingsTarget     = { paneId, instanceId };
    _indSettingsLineWidth  = inst.lineWidth;

    const label = IND_LABELS[inst.type] || inst.type;
    document.getElementById('indSM_title').textContent = label + _instParamStr(inst);
    document.getElementById('indSM_color').value = inst.color;

    // MACD uses fixed line colors (blue MACD / orange signal), so its color
    // picker is meaningless — hide it.
    document.getElementById('indSM_colorRow').style.display = inst.type === 'macd' ? 'none' : 'flex';
    // For stochastic the top picker controls the %K line specifically (%D has
    // its own picker injected below); everything else just calls it "Color".
    document.getElementById('indSM_colorLabel').textContent = inst.type === 'stochastic' ? '%K color' : 'Color';

    // Highlight active width button
    document.querySelectorAll('#indSM_widthBtns button').forEach(btn => {
        btn.style.borderColor = parseInt(btn.dataset.w) === inst.lineWidth ? '#2962FF' : '#ddd';
        btn.style.color       = parseInt(btn.dataset.w) === inst.lineWidth ? '#2962FF' : '';
    });

    // Inject type-specific param inputs
    const p = inst.params;
    let paramsHtml = '';
    if (inst.type === 'sma' || inst.type === 'ema') {
        paramsHtml = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span>Period</span>
            <input type="number" id="indSM_p_period" value="${p.period}" min="2" max="500"
                   style="width:52px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
        </div>`;
    } else if (inst.type === 'bollinger') {
        paramsHtml = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span>Period</span>
            <input type="number" id="indSM_p_period" value="${p.period}" min="2" max="500"
                   style="width:52px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
            <span>×</span>
            <input type="number" id="indSM_p_mult" value="${p.mult}" min="0.1" max="10" step="0.1"
                   style="width:44px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
        </div>`;
    } else if (inst.type === 'rsi' || inst.type === 'atr') {
        paramsHtml = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span>Period</span>
            <input type="number" id="indSM_p_period" value="${p.period}" min="2" max="200"
                   style="width:52px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
        </div>`;
    } else if (inst.type === 'macd') {
        paramsHtml = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span>F</span>
            <input type="number" id="indSM_p_fast" value="${p.fast}" min="2" max="200"
                   style="width:44px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
            <span>S</span>
            <input type="number" id="indSM_p_slow" value="${p.slow}" min="2" max="200"
                   style="width:44px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
            <span>Sig</span>
            <input type="number" id="indSM_p_signal" value="${p.signal}" min="2" max="200"
                   style="width:44px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
        </div>`;
    } else if (inst.type === 'stochastic') {
        const showK = p.showK !== false;
        const showD = p.showD !== false;
        const dColor = p.dColor || '#ff9800';
        paramsHtml = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span>K</span>
            <input type="number" id="indSM_p_period" value="${p.period}" min="2" max="200"
                   style="width:44px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
            <span>Sm</span>
            <input type="number" id="indSM_p_smoothK" value="${p.smoothK}" min="1" max="20"
                   style="width:44px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
            <span>D</span>
            <input type="number" id="indSM_p_smoothD" value="${p.smoothD}" min="1" max="20"
                   style="width:44px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;">
        </div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:6px;">
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
                <input type="checkbox" id="indSM_p_showK" ${showK ? 'checked' : ''}>

    menu.style.left = br.left + 'px';

    if (mr.right > window.innerWidth)  menu.style.left = (window.innerWidth - mr.width - 8) + 'px';
    if (mr.bottom > window.innerHeight) menu.style.top = (br.top - mr.height - 4) + 'px';

function applyIndSettings() {
    if (!_indSettingsTarget) return;
    const { paneId, instanceId } = _indSettingsTarget;
    const mgr  = panesState[paneId]?.indicatorManager;
    const data = panesState[paneId]?.data;
    if (!mgr) return;
    const inst = mgr.getInstances().find(i => i.id === instanceId);
    if (!inst) return;

    // MACD has no color control — keep its existing color untouched.
    const color     = inst.type === 'macd' ? inst.color : document.getElementById('indSM_color').value;
    const lineWidth = _indSettingsLineWidth;

    // Read updated params from injected inputs
    let params = { ...inst.params };
    const gv = id => { const el = document.getElementById(id); return el ? el.value : null; };
    if (inst.type === 'sma' || inst.type === 'ema' || inst.type === 'rsi' || inst.type === 'atr') {
        params = { ...params, period: parseInt(gv('indSM_p_period')) || inst.params.period };
    } else if (inst.type === 'bollinger') {
        params = { period: parseInt(gv('indSM_p_period')) || inst.params.period,
                   mult:   parseFloat(gv('indSM_p_mult'))  || inst.params.mult };
    } else if (inst.type === 'macd') {
        params = { fast:   parseInt(gv('indSM_p_fast'))   || inst.params.fast,
                   slow:   parseInt(gv('indSM_p_slow'))   || inst.params.slow,
                   signal: parseInt(gv('indSM_p_signal')) || inst.params.signal };
    } else if (inst.type === 'stochastic') {
        const ck = document.getElementById('indSM_p_showK');
        const cd = document.getElementById('indSM_p_showD');
        params = { period:  parseInt(gv('indSM_p_period'))  || inst.params.period,
                   smoothK: parseInt(gv('indSM_p_smoothK')) || inst.params.smoothK,
                   smoothD: parseInt(gv('indSM_p_smoothD')) || inst.params.smoothD,
                   showK:   ck ? ck.checked : (inst.params.showK !== false),
                   showD:   cd ? cd.checked : (inst.params.showD !== false),
                   dColor:  gv('indSM_p_dColor') || inst.params.dColor || '#ff9800' };
    }

    mgr.update(instanceId, params, color, lineWidth);
    if (data?.length) mgr.recomputeAll(data);
    renderIndicatorList(paneId);
    saveIndicators(paneId);
    closeIndSettings();
}

function closeIndSettings() {
    document.getElementById('indSettingsMenu').style.display = 'none';
    _indSettingsTarget = null;
}

    // пока пользователь крутит уровни в меню Фибо. Поэтому клик ВНУТРИ fibMenu
    // не должен приводить к его вызову.

document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        DrawingController.resetTool();
        [1, 2].forEach(id => {
            const st = panesState[id];
            if (st?.drawingEngine) st.drawingEngine.hideCursor();
        });
        ["lineOverlayBtn","hlineBtn1","rectOverlayBtn","lineOverlayBtn2","hlineBtn2","rectOverlayBtn2"].forEach(btnId => {
            const btn = document.getElementById(btnId);
            if (btn) { btn.style.background = ""; btn.style.color = ""; }
        });
        Object.values(panesState).forEach(st => {
            if (st.drawingEngine) { st.drawingEngine.drawings.forEach(d => d.selected = false); st.drawingEngine.render(); }
            if (st.selectedLine) st.selectedLine = null;
        });
    }

    if (e.key === "Delete") {
        Object.values(panesState).forEach(st => {
            if (st.drawingEngine) {
                const sel = st.drawingEngine.drawings.find(d => d.selected);
                if (sel) {
                    const paneId = sel.paneId;
                    st.drawingEngine.drawings = st.drawingEngine.drawings.filter(d => d !== sel);
                    st.drawingEngine.render();
                    StorageLayer.saveDrawings(paneId, layout, panesState, drawings);
                    return;
                }
            }
            if (st.selectedLine) {
                const paneId = st.selectedLine.paneId;
                st.series.removePriceLine(st.selectedLine.line);
                drawings[paneId] = drawings[paneId].filter(d => d !== st.selectedLine);
                StorageLayer.saveDrawings(paneId, layout, panesState, drawings);
                st.selectedLine = null;
            }
        });
    }

    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        const select = document.getElementById("symbolSelect");
        if (!select) return;
        let index = select.selectedIndex + (e.key === "ArrowDown" ? 1 : -1);
        if (index < 0) index = select.options.length - 1;
        if (index >= select.options.length) index = 0;
        const newSymbol = select.options[index].value;
        select.value = newSymbol;
        switchSymbol(newSymbol);
    }
});

function clearAllDrawings() {
    panes.forEach(paneId => {
        const st = panesState[paneId];
        if (!st) return;
        if (st.series) {
            drawings[paneId].forEach(obj => {
                if (obj.type === "alert" && obj.id)
                    panesState[paneId].ws.send(JSON.stringify({ type: "remove_alert", symbol: obj.symbol, id: obj.id }));
                if (obj.line) st.series.removePriceLine(obj.line);
            });
        }
        drawings[paneId] = [];
        if (layout.drawings[currentSymbol]) layout.drawings[currentSymbol][paneId] = [];
        if (st.drawingEngine) { st.drawingEngine.drawings = []; st.drawingEngine.render(); }
        if (st.selectedLine)  st.selectedLine = null;
    });
    StorageLayer.autoSave(layout);
}

// ── Тема (светлая/тёмная) ──
// CSS-часть меняется через data-theme на <html>; график LWC красится отдельно
// через applyOptions (он не читает CSS-переменные). Выбор — в layout.theme.
function chartThemeOptions() {
    const css = getComputedStyle(document.documentElement);
    const bg   = css.getPropertyValue("--chart-bg").trim();
    const text = css.getPropertyValue("--chart-text").trim();
    const grid = css.getPropertyValue("--chart-grid").trim();
    const sep  = css.getPropertyValue("--chart-sep").trim();
    return {
        layout: { background: { color: bg }, textColor: text, panes: { separatorColor: sep } },
        grid:   { vertLines: { color: grid }, horzLines: { color: grid } },
    };
}
function applyChartTheme() {
    const opts = chartThemeOptions();
    Object.values(panesState).forEach(st => { if (st.chart) st.chart.applyOptions(opts); });
}
function applyTheme(theme) {
    const t = (theme === "dark") ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    // подсветка активной кнопки в переключателе
    document.querySelectorAll("#themeToggle button").forEach(b =>
        b.classList.toggle("on", b.dataset.themeBtn === t));
    applyChartTheme();
}
