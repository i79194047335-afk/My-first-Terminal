            // наследие; сюда пишется уже корректная схема (осциллятор ~20%).
            load: () => layout.paneStretch2?.[paneId] || null,
            save: (map) => {
                layout.paneStretch2 = layout.paneStretch2 || {};
                layout.paneStretch2[paneId] = map;
                StorageLayer.autoSave(layout);
            }
        });

        // Drawing overlay
        st.drawingEngine = new DrawingEngine(paneId, st.chart, st.series, chartDiv);

        // Гистограмма стакана — под рисунками, над графиком.
        st.orderbookOverlay = new OrderbookOverlay(paneId, st.chart, st.series, chartDiv);
        if (layout[`pane${paneId}`]?.orderbook) {
            st.orderbookOverlay.setEnabled(true);
            requestOrderbook(paneId, true);
        }

        // Авторисовалка «Крюков Росса» — над стаканом, под рисунками. Данных
        // ещё нет; setData придёт с первой историей в handleMessage.
        st.rossHooks = new RossHooksOverlay(paneId, st.chart, st.series, chartDiv);
        {
            const rc = rhParams();
            st.rossHooks.setParams({ swingMode: "atr", swingMult: rc.swingMult, layers: { ...rc.layers } });
        }
        if (layout.showRossHooks === true) st.rossHooks.setEnabled(true);

        // Синхронное отображение курсоров на обеих панелях.
        // Движение мыши по одному графику отражается крестиком на другом
        // (по цене и времени курсора). _crosshairSyncing гасит обратный вызов,
        // т.к. setCrosshairPosition сам триггерит subscribeCrosshairMove.
        // Легенда следует за курсором: под ним показываются объём и дельта
        // того бара, на который смотришь. Отдельной подпиской, до синхронизации
        // перекрестий — та завязана на syncEnabled и при выключенной
        // синхронизации выходит раньше.
        st.chart.subscribeCrosshairMove(param => {
            if (!st.volumeSeries) return;
            if (!param.point || typeof param.time !== "number") {
                st.legendPinned = false;
                renderVolumeLegend(paneId, st.data?.[st.data.length - 1]);
                return;
            }
            st.legendPinned = true;
            const bar = st.data?.find(b => b.time === param.time);
            if (bar) renderVolumeLegend(paneId, bar);
        });

        st.chart.subscribeCrosshairMove(param => {
            if (_crosshairSyncing || !syncEnabled) return;
            const otherId = paneId === 1 ? 2 : 1;
            const other   = panesState[otherId];
            if (!other || !other.chart || !other.series) return;

            _crosshairSyncing = true;
            try {
                if (!param.point || typeof param.time !== "number") {
                    other.chart.clearCrosshairPosition();
                } else {
                    const price = st.series.coordinateToPrice(param.point.y);
                    if (price !== null) {
                        other.chart.setCrosshairPosition(price, param.time, other.series);
                    } else {
                        other.chart.clearCrosshairPosition();
                    }
                }
            } catch (e) {}
            _crosshairSyncing = false;
        });

        applyColors();
        setupInteractionHandlers(paneId, st, els);
    }

    // Expose createChartInternal so handleMessage can call it on first history
    // (closure over id/state/els is correct here)
    window[`_createChart${id}`] = createChartInternal;

    function updateCountdown(paneId) {
        const st = panesState[paneId];
        if (!st.lastCandle || !st.series) return;
        let txt;
        if (st.rangePips) {
            // У рэндж-бара нет времени закрытия — показываем набранный
            // диапазон в ПОИНТАХ: «6/10» (rangePips хранит поинты, как задан R).
            const got = (st.lastCandle.high - st.lastCandle.low)
                        / pointSizeOf(currentSymbol);
            txt = got.toFixed(0) + "/" + st.rangePips;
        } else {
            const now    = Math.floor(Date.now() / 1000);
            const bucket = Math.floor(now / st.tfSeconds) * st.tfSeconds;
            let remain   = st.tfSeconds - (now - bucket);
            if (remain < 0) remain = 0;
            // ММ:СС до часа, ЧЧ:ММ:СС дальше — иначе H4/D1 показывали "238:47"
            const h  = Math.floor(remain / 3600);
            const m  = Math.floor((remain % 3600) / 60).toString().padStart(2,'0');
            const s  = (remain % 60).toString().padStart(2,'0');
            txt = h > 0 ? `${h.toString().padStart(2,'0')}:${m}:${s}` : `${m}:${s}`;
        }
        const y  = st.series.priceToCoordinate(st.lastCandle.close);
        if (y === null) return;
        const el = getPaneElements(paneId).countdown;
        el.style.top  = (y + 9) + "px";
        el.style.background = st.lastCandle.close >= st.lastCandle.open ? "#089981" : "#f23645";
        el.innerText  = txt;
    }
}

// ============================================================================
// createChartInternal — called from handleMessage on first history
// ============================================================================
function createChartInternal(id, tfSec) {
    window[`_createChart${id}`]?.(id, tfSec);
}

// ============================================================================
// Interaction handlers (drawing, drag, context menus, touch)
// ============================================================================
function setupInteractionHandlers(paneId, st, els) {
    const id = paneId;

    let touchPrevX = null, touchPrevY = null;
    let touchStartX = null, touchStartY = null;
    let mobileEditMode = null, mobileEditPrevX = null, mobileEditPrevY = null;
    let mobileEditStartX = null, mobileEditStartY = null;

    els.wrapper.addEventListener("touchstart", e => {
        const tool = DrawingController.getTool();
        const isDrawing = (tool === "lineOverlay" || tool === "rectOverlay" || tool === "fib" || tool === "hline");

        if (isDrawing) {
            st.chart.applyOptions({ handleScroll: false, handleScale: false });
            e.preventDefault();
            touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
            touchPrevX  = e.touches[0].clientX; touchPrevY  = e.touches[0].clientY;
            if (!st.drawingEngine.cursorActive) st.drawingEngine.showCursor();
            return;
        }

        if (tool === "idle") {
            const touch = e.touches[0];
            const rect  = els.wrapper.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            mobileEditStartX = touch.clientX; mobileEditStartY = touch.clientY;
            mobileEditPrevX  = touch.clientX; mobileEditPrevY  = touch.clientY;

            const pointHit = st.drawingEngine.hitTestPoint(x, y);
            if (pointHit) {
                mobileEditMode = "point";
                DrawingController.startDrag(pointHit.obj, null, null, pointHit.pointIndex);
                st.chart.applyOptions({ handleScroll: false, handleScale: false });
                e.preventDefault(); return;
            }
            const lineHit = st.drawingEngine.hitTestLine(x, y);
            if (lineHit) {
                mobileEditMode = "line";
                DrawingController.startDrag(lineHit, 0, 0, null);
                DrawingController.originalPoints = lineHit.points.map(p => ({ ...p }));
                st.chart.applyOptions({ handleScroll: false, handleScale: false });
                e.preventDefault(); return;
            }
            const stLocal = panesState[id];
            if (stLocal.selectedLine) {
                const lineY = st.series.priceToCoordinate(stLocal.selectedLine.price);
                if (lineY !== null && Math.abs(lineY - y) < 16) {
                    mobileEditMode = "hline"; isDragging = true;
                    st.chart.applyOptions({ handleScroll: false, handleScale: false });
                    e.preventDefault(); return;
                }
            }
        }
    }, { passive: false });

    els.wrapper.addEventListener("touchmove", e => {
        e.preventDefault();
        const tool = DrawingController.getTool();
        const isDrawing = (tool === "lineOverlay" || tool === "rectOverlay" || tool === "fib");
        const touch = e.touches[0];
        const rect  = els.wrapper.getBoundingClientRect();
        const tx = touch.clientX - rect.left;
        const ty = touch.clientY - rect.top;

        if (isDrawing) {
            if (touchPrevX !== null) {
                const dx = touch.clientX - touchPrevX, dy = touch.clientY - touchPrevY;
                st.drawingEngine.moveCursor(dx, dy);
                const newX = st.drawingEngine.cursorX, newY = st.drawingEngine.cursorY;
                const preview = DrawingController.getPreviewLine();
                if (preview && DrawingController.getTempStart()) {
                    const rawTime = st.chart.timeScale().coordinateToTime(newX);
                    const price   = st.series.coordinateToPrice(newY);
                    if (rawTime && price !== null) {
                        const time = typeof rawTime === "object" ? rawTime.timestamp : rawTime;
                        if (typeof time === "number") { preview.points[1] = { time, price }; st.drawingEngine.render(); }
                    }
                }
            }
            touchPrevX = touch.clientX; touchPrevY = touch.clientY; return;
        }

        if (mobileEditMode && mobileEditPrevX !== null) {
            const dx = touch.clientX - mobileEditPrevX, dy = touch.clientY - mobileEditPrevY;
            mobileEditPrevX = touch.clientX; mobileEditPrevY = touch.clientY;

            if (mobileEditMode === "point") {
                const draggedLine = DrawingController.getDraggedLine();
                const pointIndex  = DrawingController.getDraggedPointIndex();
                if (!draggedLine || pointIndex === null) return;
                const p = draggedLine.points[pointIndex];
                const px = st.drawingEngine.timeMapper.getX(p.time);
                const py = st.series.priceToCoordinate(p.price);
                if (px === null || py === null) return;
                const newX    = Math.max(0, Math.min(rect.width,  px + dx));
                const newY    = Math.max(0, Math.min(rect.height, py + dy));
                const rawTime = st.chart.timeScale().coordinateToTime(newX);
                const price   = st.series.coordinateToPrice(newY);
                if (!rawTime || price === null) return;
                const time = typeof rawTime === "object" ? rawTime.timestamp : rawTime;
                if (typeof time !== "number") return;
                draggedLine.points[pointIndex] = { time, price };
                st.drawingEngine.render(); return;
            }
            if (mobileEditMode === "line") {
                const draggedLine = DrawingController.getDraggedLine();
                if (!draggedLine) return;
                const cx = rect.width / 2, cy2 = rect.height / 2;
                const rawT1 = st.chart.timeScale().coordinateToTime(cx);
                const rawT2 = st.chart.timeScale().coordinateToTime(cx + dx);
                const p1v   = st.series.coordinateToPrice(cy2);
                const p2v   = st.series.coordinateToPrice(cy2 + dy);
                if (!rawT1 || !rawT2 || p1v === null || p2v === null) return;
                const t1 = typeof rawT1 === "object" ? rawT1.timestamp : rawT1;
                const t2 = typeof rawT2 === "object" ? rawT2.timestamp : rawT2;
                draggedLine.points = DrawingController.originalPoints.map(p => ({
                    time: p.time + (t2 - t1), price: p.price + (p2v - p1v)
                }));
                st.drawingEngine.render(); return;
            }
            if (mobileEditMode === "hline") {
                const stLocal = panesState[id];
                if (!stLocal.selectedLine) return;
                const lineY = st.series.priceToCoordinate(stLocal.selectedLine.price);
                if (lineY === null) return;
                const newPrice = st.series.coordinateToPrice(lineY + dy);
                if (newPrice === null) return;
                stLocal.selectedLine.price = newPrice;
                stLocal.selectedLine.line.applyOptions({ price: newPrice });
                if (stLocal.selectedLine.type === "alert") {
                    moveAlert(id, stLocal.selectedLine, newPrice);
                }
                return;
            }
        }
    }, { passive: false });

    els.wrapper.addEventListener("touchend", e => {
        const tool = DrawingController.getTool();
        const isDrawing = (tool === "lineOverlay" || tool === "rectOverlay" || tool === "fib" || tool === "hline");

        if (isDrawing) {
            const isTap = touchStartX !== null && e.changedTouches.length > 0 &&
                Math.abs(e.changedTouches[0].clientX - touchStartX) < 8 &&
                Math.abs(e.changedTouches[0].clientY - touchStartY) < 8;
            touchStartX = null; touchStartY = null; touchPrevX = null; touchPrevY = null;
            if (!isTap) return;

            if (tool === "lineOverlay" || tool === "rectOverlay" || tool === "fib") {
                const cx = st.drawingEngine.cursorX, cy = st.drawingEngine.cursorY;
                if (cx === null || cy === null) return;
                const rawTime = st.chart.timeScale().coordinateToTime(cx);
                const price   = st.series.coordinateToPrice(cy);
                if (!rawTime || price === null) return;
                const time = typeof rawTime === "object" ? rawTime.timestamp : rawTime;
                if (typeof time !== "number") return;
                if (!DrawingController.getTempStart()) {
                    const startPoint = { time, price };
                    DrawingController.setTempStart(startPoint);
                    const preview = tool === "fib"
                        ? makeFib(id, startPoint, { ...startPoint })
                        : {
                            type: tool === "lineOverlay" ? "line" : "rect",
                            paneId: id, points: [startPoint, { ...startPoint }],
                            color: "#000000", width: 2,
                            ...(tool === "rectOverlay" ? { fillColor: "rgba(41,98,255,0.15)", showMidline: true, midColor: "#000000", midWidth: 1, extendRight: true } : {})
                        };
                    DrawingController.setPreviewLine(preview);
                    st.drawingEngine.addDrawing(preview); return;
                }
                const preview = DrawingController.getPreviewLine();
                preview.points[1] = { time, price };
                DrawingController.clearPreview(); DrawingController.resetTool(); st.drawingEngine.hideCursor();
                ["lineOverlayBtn","rectOverlayBtn","lineOverlayBtn2","rectOverlayBtn2"].forEach(id => {
                    const b = document.getElementById(id);
                    if (b) { b.style.background = ""; b.style.color = ""; }
                });
                ["fibBtn1","fibBtn2"].forEach(bid => {
                    const b = document.getElementById(bid);
                    if (b) b.classList.remove("on");
                });
                StorageLayer.saveDrawings(id, layout, panesState, drawings);
                st.chart.applyOptions({ handleScroll: true, handleScale: true }); return;
            }
            if (tool === "hline") {
                const cy = st.drawingEngine.cursorY;
                if (cy === null) return;
                const price = st.series.coordinateToPrice(cy);
                if (price === null) return;
                addHorizontalLine(id, price);
                DrawingController.resetTool(); st.drawingEngine.hideCursor();
                updateToolButtonState(false);
                st.chart.applyOptions({ handleScroll: true, handleScale: true }); return;
            }
        }
        if (mobileEditMode) {
            if (mobileEditMode === "point" || mobileEditMode === "line") {
                DrawingController.stopDrag();
                StorageLayer.saveDrawings(id, layout, panesState, drawings);
            }
            if (mobileEditMode === "hline") {
                isDragging = false;
                StorageLayer.saveDrawings(id, layout, panesState, drawings);
            }
            st.chart.applyOptions({ handleScroll: true, handleScale: true });
            mobileEditMode = null; mobileEditPrevX = null; mobileEditPrevY = null;
            mobileEditStartX = null; mobileEditStartY = null;
        }
    });

    // Click handler
    st.chart.subscribeClick(param => {
        if (isMobile() && isDrawingActive()) return;

        // Time sync between panes
        if (syncEnabled && typeof param.time === "number") {
            const otherId = id === 1 ? 2 : 1;
            const other   = panesState[otherId];
            if (other?.chart && other.tfSeconds) {
                const visible = other.chart.timeScale().getVisibleRange();
                if (visible && (param.time < visible.from || param.time > visible.to)) {
                    other.chart.timeScale().setVisibleRange({
                        from: param.time - other.tfSeconds * 50,
                        to:   param.time + other.tfSeconds * 50
                    });
                }
            }
        }

        if (!param.point) return;

        // Overlay line selection
        if (DrawingController.getTool() === "idle") {
            const found = st.drawingEngine.hitTestLine(param.point.x, param.point.y);
            st.drawingEngine.drawings.forEach(d => d.selected = false);
            if (found) found.selected = true;
            st.drawingEngine.render();
        }

        if (DrawingController.getTool() === "lineOverlay") {
            const price = st.series.coordinateToPrice(param.point.y);
            if (price === null) return;
            const time = param.time;
            if (typeof time !== "number") return;
            if (!DrawingController.getTempStart()) {
                const startPoint = { time, price };
                DrawingController.setTempStart(startPoint);
                const preview = { type: "line", paneId: id, points: [startPoint, startPoint], color: "#000000", width: 2 };
                DrawingController.setPreviewLine(preview);
                st.drawingEngine.addDrawing(preview); return;
            }
            const preview = DrawingController.getPreviewLine();
            preview.points[1] = { time, price };
            DrawingController.clearPreview(); DrawingController.resetTool();
            StorageLayer.saveDrawings(id, layout, panesState, drawings);
            ["lineOverlayBtn","lineOverlayBtn2"].forEach(bid => {
                const b = document.getElementById(bid);
                if (b) { b.style.background = ""; b.style.color = ""; }
            });
            return;
        }

        if (DrawingController.getTool() === "rectOverlay") {
            const price = st.series.coordinateToPrice(param.point.y);
            if (price === null) return;
            let rawTime = param.time;
            if (!rawTime) return;
            const time = typeof rawTime === "object" ? rawTime.timestamp : rawTime;
            if (typeof time !== "number") return;
            if (!DrawingController.getTempStart()) {
                const startPoint = { time, price };
                DrawingController.setTempStart(startPoint);
                const preview = { type: "rect", paneId: id, points: [startPoint, startPoint], color: "#000000", width: 2, fillColor: "rgba(41,98,255,0.15)", showMidline: true, midColor: "#000000", midWidth: 1, extendRight: true };
                DrawingController.setPreviewLine(preview);
                st.drawingEngine.addDrawing(preview); return;
            }
            const preview = DrawingController.getPreviewLine();
            preview.points[1] = { time, price };
            DrawingController.clearPreview(); DrawingController.resetTool();
            StorageLayer.saveDrawings(id, layout, panesState, drawings);
            ["rectOverlayBtn","rectOverlayBtn2"].forEach(bid => {
                const b = document.getElementById(bid);
                if (b) { b.style.background = ""; b.style.color = ""; }
            });
            return;
        }

        if (DrawingController.getTool() === "fib") {
            const price = st.series.coordinateToPrice(param.point.y);
            if (price === null) return;
            let rawTime = param.time;
            if (!rawTime) return;
            const time = typeof rawTime === "object" ? rawTime.timestamp : rawTime;
            if (typeof time !== "number") return;
            if (!DrawingController.getTempStart()) {
                const startPoint = { time, price };
                DrawingController.setTempStart(startPoint);
                const preview = makeFib(id, startPoint, { ...startPoint });
                DrawingController.setPreviewLine(preview);
                st.drawingEngine.addDrawing(preview); return;
            }
            const preview = DrawingController.getPreviewLine();
            preview.points[1] = { time, price };
            DrawingController.clearPreview(); DrawingController.resetTool();
            StorageLayer.saveDrawings(id, layout, panesState, drawings);
            ["fibBtn1","fibBtn2"].forEach(bid => {
                const b = document.getElementById(bid);
                if (b) b.classList.remove("on");
            });
            return;
        }

        if (DrawingController.getTool() === "posLong" || DrawingController.getTool() === "posShort") {
            const pprice = st.series.coordinateToPrice(param.point.y);
            if (pprice === null) return;
            let rawTime = param.time;
            if (!rawTime) return;
            const time = typeof rawTime === "object" ? rawTime.timestamp : rawTime;
            if (typeof time !== "number") return;
            const side = DrawingController.getTool() === "posLong" ? "long" : "short";
            st.drawingEngine.drawings.forEach(d => d.selected = false);
            const pos = PositionCalc.createPosition(side, id, time, pprice, currentSymbol);
            pos.selected = true;
            st.drawingEngine.addDrawing(pos);
            DrawingController.resetTool();
            StorageLayer.saveDrawings(id, layout, panesState, drawings);
            ["posBtn1","posBtn2"].forEach(bid => {
                const b = document.getElementById(bid);
                if (b) { b.style.background = ""; b.style.color = ""; }
            });
            return;
        }

        const price = st.series.coordinateToPrice(param.point.y);
        if (price === null) return;

        if (DrawingController.getTool() === "hline") {
            addHorizontalLine(id, price);
            DrawingController.resetTool(); updateToolButtonState(false);
            updateCursor(els.wrapper, "default"); return;
        }
        if (DrawingController.getTool() === "alert") {
            addAlertLine(id, price);
            DrawingController.resetTool();
            const alertBtn = document.getElementById("AlertBtn");
            if (alertBtn) { alertBtn.style.background = ""; alertBtn.style.color = ""; }
            return;
        }

        // hline hit test
        let found = null;
        drawings[id].forEach(obj => {
            const ly = st.series.priceToCoordinate(obj.price);
            if (ly !== null && Math.abs(ly - param.point.y) < 6) found = obj;
        });
        if (found) selectLine(found); else deselectLine();

        // Signal marker click — navigate to the signal that occupies this candle bucket
        // (на рэндж-ТФ маркеры не рисуются — там нет временных бакетов)
        if (_signalsVisible && st.tfSeconds && typeof param.time === "number" && DrawingController.getTool() === "idle") {
            const tf = st.tfSeconds;
            const clickedBucket = Math.floor(param.time / tf) * tf;
            const matchIdx = _signalLog.findLastIndex(s => {
                const snapped = Math.floor(s.time / tf) * tf;
                return s.symbol === currentSymbol && snapped === clickedBucket;
            });
            if (matchIdx !== -1) {
                _signalPanelIndex = matchIdx;
                renderSignalInPanel(_signalPanelIndex);
            }
        }
    });

    // Mouse move — overlay drag + hline drag
    function onMoveOverlay(e) {
        const coords = getEventCoords(e);
        if (DrawingController.isDragging()) {
            const draggedLine = DrawingController.getDraggedLine();
            const rect  = els.wrapper.getBoundingClientRect();
            const x = coords.clientX - rect.left, y = coords.clientY - rect.top;

            // ---- POSITION drag ----
            if (draggedLine && draggedLine.type === "position") {
                const handle = DrawingController.getPosHandle();
                const price  = st.series.coordinateToPrice(y);

                if (handle === "width") {
                    const xL = st.drawingEngine.timeMapper.getX(draggedLine.t1);
                    if (xL !== null) {
                        const barSpacing = st.chart.timeScale().options().barSpacing || 6;
                        let bars = Math.round((x - xL) / barSpacing);
                        if (bars < 3) bars = 3;
                        draggedLine.barsWidth = bars;
                    }
                } else if (handle === "body") {
                    if (price !== null && DrawingController.posDragStartPrice !== null) {
                        const dPrice = price - DrawingController.posDragStartPrice;
                        draggedLine.entry  = DrawingController.posOrig.entry  + dPrice;
                        draggedLine.stop   = DrawingController.posOrig.stop   + dPrice;
                        draggedLine.target = DrawingController.posOrig.target + dPrice;
                        const rawT = st.chart.timeScale().coordinateToTime(x);
                        if (rawT && DrawingController.posDragStartTime !== null) {
                            const t = typeof rawT === "object" ? rawT.timestamp : rawT;
                            if (typeof t === "number") {
                                draggedLine.t1 = DrawingController.posOrig.t1 + (t - DrawingController.posDragStartTime);
                            }
                        }
                    }
                } else if (price !== null) {
                    // entry / stop / target — двигаем только цену уровня
                    draggedLine[handle] = price;
                }
                st.drawingEngine.render();
                return;
            }

            let rawTime = st.chart.timeScale().coordinateToTime(x);
            const price = st.series.coordinateToPrice(y);
            if (!rawTime || price === null) return;
            const time = typeof rawTime === "object" ? rawTime.timestamp : rawTime;
            if (typeof time !== "number") return;
            const draggedPointIndex = DrawingController.getDraggedPointIndex();
            if (draggedPointIndex !== null) {
                draggedLine.points[draggedPointIndex] = { time, price };
                st.drawingEngine.render(); return;
            }
            const deltaTime  = time  - DrawingController.getDragStartTime();
            const deltaPrice = price - DrawingController.getDragStartPrice();
            draggedLine.points = DrawingController.originalPoints.map(p => ({ time: p.time + deltaTime, price: p.price + deltaPrice }));
            st.drawingEngine.render(); return;
        }
        if (DrawingController.getTool() !== "lineOverlay" && DrawingController.getTool() !== "rectOverlay" && DrawingController.getTool() !== "fib") return;
        const tempStart = DrawingController.getTempStart();
        const preview   = DrawingController.getPreviewLine();
        if (!tempStart || !preview) return;
        const rect  = els.wrapper.getBoundingClientRect();
        const x = coords.clientX - rect.left, y = coords.clientY - rect.top;
        const price = st.series.coordinateToPrice(y);
        if (price === null) return;
        const time = st.chart.timeScale().coordinateToTime(x);
        if (time === null) return;
        preview.points[1] = { time, price };
        st.drawingEngine.render();
    }
    els.wrapper.addEventListener("mousemove", onMoveOverlay);

    function onMoveHLine(e) {
        const stLocal = panesState[id];
        if (!isDragging || !stLocal.selectedLine) return;
        const coords = getEventCoords(e);
        const rect   = els.wrapper.getBoundingClientRect();
        const y      = coords.clientY - rect.top;
        const newPrice = st.series.coordinateToPrice(y);
        if (newPrice === null) return;
        stLocal.selectedLine.price = newPrice;
        stLocal.selectedLine.line.applyOptions({ price: newPrice });
        if (stLocal.selectedLine.type === "alert") {
            moveAlert(id, stLocal.selectedLine, newPrice);
        }
    }
    els.wrapper.addEventListener("mousemove", onMoveHLine);

    // Context menu
    els.wrapper.addEventListener("contextmenu", e => {
        e.preventDefault();
        const rect = els.wrapper.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        const overlayHit = st.drawingEngine.hitTestLine(x, y);
        if (overlayHit) {
            st.drawingEngine.drawings.forEach(d => d.selected = false);
            overlayHit.selected = true; st.drawingEngine.render();
            if (overlayHit.type === "position") {
                showPositionMenu(e.pageX, e.pageY, id, overlayHit);
            } else if (overlayHit.type === "fib") {
                showFibMenu(e.pageX, e.pageY, id, overlayHit);
            } else {
                showOverlayMenu(e.pageX, e.pageY, id, overlayHit);
            }
            return;
        }
        let found = null;
        drawings[id].forEach(obj => {
            const ly = st.series.priceToCoordinate(obj.price);
            if (ly !== null && Math.abs(ly - y) < 8) found = obj;
        });
        if (found) {
            selectLine(found);
            if (found.type === "alert") { showAlertMenu(e.pageX, e.pageY, id, found); return; }
            showOverlayMenu(e.pageX, e.pageY, id, found);
        } else {
            const price = st.series.coordinateToPrice(y);
            if (price !== null) showChartMenu(e.pageX, e.pageY, id, price);
        }
    });

    // mousedown — drag start (desktop)
    function onDownHLine(e) {
        if (isMobile()) return;
        const stLocal = panesState[id];
        if (!stLocal.selectedLine) return;
        const coords = getEventCoords(e);
        const rect   = els.wrapper.getBoundingClientRect();
        const y      = coords.clientY - rect.top;
        const lineY  = st.series.priceToCoordinate(stLocal.selectedLine.price);
        if (lineY === null) return;
        if (Math.abs(lineY - y) < 12) {
            isDragging = true;
            st.chart.applyOptions({ handleScroll: false, handleScale: false });
            updateCursor(els.wrapper, "ns-resize");
        }
    }
    els.wrapper.addEventListener("mousedown", onDownHLine);

    function onDownOverlay(e) {
        if (isMobile()) return;
        if (DrawingController.getTool() !== "idle") return;
        const coords = getEventCoords(e);
        const rect   = els.wrapper.getBoundingClientRect();
        const x = coords.clientX - rect.left, y = coords.clientY - rect.top;

        // ---- Position: хэндлы уровней / ширины ----
        const posHit = st.drawingEngine.hitTestPositionHandle(x, y);
        if (posHit) {
            st.drawingEngine.drawings.forEach(d => d.selected = false);
            posHit.obj.selected = true;
            DrawingController.startPosDrag(posHit.obj, posHit.handle);
            st.chart.applyOptions({ handleScroll: false, handleScale: false });
            st.drawingEngine.render();
            return;
        }

        const pointHit = st.drawingEngine.hitTestPoint(x, y);
        if (pointHit) {
            DrawingController.startDrag(pointHit.obj, null, null, pointHit.pointIndex);
            st.chart.applyOptions({ handleScroll: false, handleScale: false }); return;
        }
        const found = st.drawingEngine.hitTestLine(x, y);
        if (found && found.type === "position") {
            // перенос всей позиции целиком
            st.drawingEngine.drawings.forEach(d => d.selected = false);
            found.selected = true;
            DrawingController.startPosDrag(found, "body");
            DrawingController.posDragStartPrice = st.series.coordinateToPrice(y);
            const rawT = st.chart.timeScale().coordinateToTime(x);
            DrawingController.posDragStartTime = rawT ? (typeof rawT === "object" ? rawT.timestamp : rawT) : null;
            st.chart.applyOptions({ handleScroll: false, handleScale: false });
            st.drawingEngine.render();
            return;
        }
        if (!found) return;
        const projection = st.drawingEngine.getProjectionOnLine(found, x, y);
        if (!projection) return;
        const rawStart = st.chart.timeScale().coordinateToTime(projection.projX);
        if (!rawStart) return;
        const startTime  = typeof rawStart === "object" ? rawStart.timestamp : rawStart;
        const startPrice = st.series.coordinateToPrice(projection.projY);
        if (startPrice === null) return;
        DrawingController.startDrag(found, startTime, startPrice, null);
        st.chart.applyOptions({ handleScroll: false, handleScale: false });
    }
    els.wrapper.addEventListener("mousedown", onDownOverlay);

    function onUpOverlay() {
        if (isMobile()) return;
        if (!DrawingController.isDragging()) return;
        DrawingController.stopDrag();
        st.chart.applyOptions({ handleScroll: true, handleScale: true });
        StorageLayer.saveDrawings(id, layout, panesState, drawings);
    }
    els.wrapper.addEventListener("mouseup", onUpOverlay);

    function onUpHLine() {
        if (isMobile()) return;
        if (isDragging && panesState[id].selectedLine)
            StorageLayer.saveDrawings(id, layout, panesState, drawings);
        isDragging = false;
        st.chart.applyOptions({ handleScroll: true, handleScale: true });
        updateCursor(els.wrapper, "default");
    }
    els.wrapper.addEventListener("mouseup", onUpHLine);
}

// ============================================================================
// setTF
// ============================================================================
function setTF(paneId, tf) {
    const st = panesState[paneId];
    st.requestId++;
    st.rangePips = parseRangeTF(tf);
    // Для рэндж-ТФ tfSeconds = null: вся временная логика (таймер, бакеты
    // маркеров, crosshair-sync) обязана проверять его перед использованием.
    st.tfSeconds = st.rangePips ? null : TF_MAP[tf];
    if (st.drawingEngine) st.drawingEngine.setTimeframe(st.tfSeconds);
    if (st.chart) {
        // Сбросить перекрестие перед сменой ТФ: иначе при подмене данных на ТФ с
        // меньшим числом баров LWC дёргает устаревший логический индекс курсора
        // во время рассинхрона и бросает "Value is null" на каждое движение мыши.
        try { st.chart.clearCrosshairPosition(); } catch (e) {}

        // Бары старого ТФ убираем сразу: при переходе на рэндж-ТФ история
        // строится бэкфилом в фоне, и до её прихода на графике оставался бы
        // прежний ряд — с ним LWC роняет "Cannot update oldest data" на
        // первом же живом баре (см. switchSymbol).
        st.data = [];
        st.lastCandle = null;
        try { st.series?.setData([]); } catch (e) {}
        if (st.volumeSeries) { try { st.volumeSeries.setData([]); } catch (e) {} }
        renderVolumeLegend(paneId, null);
        st.chart.applyOptions({ timeScale:
            { secondsVisible: !st.tfSeconds || st.tfSeconds < 60 } });
    }
    layout[`pane${paneId}`] = layout[`pane${paneId}`] || {};
    layout[`pane${paneId}`].tf = tf;

    // Рэндж-ТФ запоминается НА ИНСТРУМЕНТ. R задан в поинтах, а поинт у
    // инструментов различается в тысячи раз: R500 — это ~$50 на BTC (темп M5)
    // и 0.05 на LIT (цена $2.2, бар в жизни не закроется). Без этой памяти
    // при каждом переключении пары приходилось бы подбирать R заново.
    if (parseRangeTF(tf)) {
        layout.rangeTf = layout.rangeTf || {};
        layout.rangeTf[currentSymbol] = tf;
        layout[`pane${paneId}`].rangeOn = true;
    } else {
        // Обычный ТФ — запоминаем как «куда вернуться» при выключении рэнджа.
        layout[`pane${paneId}`].lastTimeTf = tf;
    }
    StorageLayer.autoSave(layout);
    syncRButtons();
    DrawingController.resetTool();

    if (st.ws.readyState === WebSocket.OPEN) {
        st.ws.send(JSON.stringify({ type: "set_tf", symbol: currentSymbol, tf, requestId: st.requestId }));
    }
}

// ============================================================================
// switchSymbol
// ============================================================================
function switchSymbol(symbol) {
    currentSymbol = symbol;
    resetMarketDot();   // индикатор рынка — заново с тиков нового инструмента
    resetTape();        // лента чужого инструмента к новому отношения не имеет

    [1, 2].forEach(paneId => {
        const st = panesState[paneId];
        if (!st) return;

        // Рисунки нового символа поднимаем СРАЗУ из layout, не дожидаясь
        // "history": st.series уже существует (график при смене пары не
        // пересоздаётся), и раньше между сбросом старых рисунков и приходом
        // истории оставалось пустое окно. В него мог попасть широковещательный
        // "shocks"/"shock" (идут без requestId, см. BROADCAST_TYPES) — их
        // обработчик видел пустой drawingEngine.drawings и сохранял его как
        // есть, полной перезаписью стирая линии/прямоугольники/фибо инструмента
        // из localStorage безвозвратно (переживало даже F5).
        StorageLayer.restoreDrawings(paneId, layout, panesState, drawings);

        // Данные ПРЕДЫДУЩЕГО инструмента убираем сразу, не дожидаясь истории
        // нового. На обычных ТФ история приходит мгновенно и подменяет их, а
        // рэндж-бары строятся бэкфилом в фоне — секунды, за которые на графике
        // висели чужие бары. Дальше приходил живой бар нового инструмента со
        // временем раньше оставшихся, и LWC падал с "Cannot update oldest
        // data", рисуя два ряда сразу.
        st.data = [];
        st.lastCandle = null;
        try { st.chart?.clearCrosshairPosition(); } catch (e) {}
        try { st.series?.setData([]); } catch (e) {}
        if (st.volumeSeries) { try { st.volumeSeries.setData([]); } catch (e) {} }
        renderVolumeLegend(paneId, null);
        // Стакан предыдущего инструмента — чужие цены. Держать его до
        // прихода нового значило бы рисовать стены не того рынка.
        if (st.orderbookOverlay) st.orderbookOverlay.setBook(null);
        // Крюки прошлого инструмента — по чужим ценам. Гасим до новой истории.
        if (st.rossHooks) st.rossHooks.setData([]);
    });

    layout.symbol = symbol;
    StorageLayer.autoSave(layout);

    [1, 2].forEach(id => {
        const state = panesState[id];
        if (!state) return;
        state.indicatorsLoaded = false; // force reload on next history
        applyPriceFormat(id);           // precision нового символа
        // Стакан: у нового инструмента его может не быть (форекс). Хабу
        // сообщаем в любом случае — он сам решит, у кого отписаться.
        if (state.orderbookOverlay) {
            const want = layout.showOrderbook === true && orderbookAvailable();
            state.orderbookOverlay.setEnabled(want);
            requestOrderbook(id, want);
        }
        // Объём есть не у всех: у FXCM это поток котировок, а не сделок.
        // Снимаем/ставим серию сразу, не дожидаясь истории, иначе на
        // форексе остались бы висеть столбцы от прошлого инструмента.
        ensureVolumeSeries(id);

        // Рэндж-режим принадлежит ПАНЕЛИ (rangeOn), а конкретный R — ИНСТРУМЕНТУ
        // (R в поинтах несопоставим между парами). При смене пары:
        //  • рэндж вкл → берём запомненный R нового инструмента, иначе прикидку;
        //  • рэндж выкл → обычный ТФ (последний временно́й).
        const paneCfg = layout[`pane${id}`] || (layout[`pane${id}`] = {});
        let tf;
        if (paneCfg.rangeOn) {
            tf = layout.rangeTf?.[currentSymbol] || suggestRangeTF(currentSymbol);
            if (!tf) { paneCfg.rangeOn = false; tf = paneCfg.lastTimeTf || "M1"; }
        } else {
            tf = paneCfg.lastTimeTf || paneCfg.tf || "M1";
            if (parseRangeTF(tf)) tf = "M1";
        }
        const els2 = getPaneElements(id);
        if (els2?.tfSelect && !parseRangeTF(tf)) els2.tfSelect.value = tf;
        syncRButtons();

        const rs = state.ws && state.ws.readyState;

        if (rs === WebSocket.OPEN) {
            // Переиспользуем открытый сокет: set_tf несёт новый currentSymbol,
            // сервер обновляет привязку символа. Без teardown — нет предупреждения
            // "closed before connection established" и реконнект-шторма.
            setTF(id, tf);
        } else if (rs === WebSocket.CONNECTING) {
            // Сокет ещё открывается — его onopen сам запросит уже обновлённый
            // currentSymbol, пересоздавать не нужно.
        } else {
            // Только если сокет закрыт/закрывается — создаём заново.
            state.ws = new WebSocket(WS_URL);
            if (id === 1) ws1 = state.ws;
            if (id === 2) ws2 = state.ws;
            wireSocket(id, state, getPaneElements(id));
        }
    });
    // Селектор выставляется ЗДЕСЬ, а не только при инициализации: switchSymbol
    // зовут и программно (переход по сигналу из панели), и тогда выпадающий
    // список оставался на прежней паре, противореча тому, что на графике.
    const symSelect = document.getElementById("symbolSelect");
    if (symSelect && symSelect.value !== symbol) {
        // Значение может быть в другом формате имени (с префиксом провайдера
        // или без) — ищем совпадающий пункт, прежде чем присваивать.
        const match = Array.from(symSelect.options).find(
            o => o.value === symbol || displaySymbol(o.value) === displaySymbol(symbol));
        if (match) symSelect.value = match.value;
    }
    syncOrderbookButtons();
    syncRossHooksButtons();
    refreshSignalMarkers();
    // Если панель брифинга открыта — перерендерить для нового символа
    if (briefVisible) renderBriefing();
}

// ============================================================================
// Layout / fullscreen / zoom
// ============================================================================
function toggleFull(id) {
    const column1 = document.getElementById("column1");
    const column2 = document.getElementById("column2");
    if (layout.split === "split") {
        if (id === 1) { column2.style.display = "none"; column1.style.flex = "1 1 100%"; layout.split = "leftFull"; }
        else          { column1.style.display = "none"; column2.style.flex = "1 1 100%"; layout.split = "rightFull"; }
    } else {
        column1.style.display = ""; column2.style.display = "";
        column1.style.flex = "1"; column2.style.flex = "1"; layout.split = "split";
    }
    StorageLayer.autoSave(layout);
    requestAnimationFrame(() => {
        document.body.offsetHeight;
        Object.keys(panesState).forEach(k => {
            const s = panesState[k];
            if (!s.chart) return;
            const div = document.getElementById(`chart${k}`);
            if (!div) return;
            s.chart.resize(div.clientWidth, div.clientHeight);
            // Канвас-оверлей рисования ресайзится только по window.resize, которого
            // при развороте нет — без этого канвас остаётся прежней ширины и режет
            // рисунки «невидимой стеной» по середине экрана.
            s.drawingEngine?.resize();
            applyBarCount(parseInt(k));
        });
    });
}

function autoScaleChart(id) {
    const st = panesState[id];
    if (!st?.chart) return;
    applyBarCount(id);
    st.chart.priceScale("right").applyOptions({ autoScale: true });
}

function applyBarCount(id) {
    const st = panesState[id];
    if (!st?.chart) return;
    const width = st.chart.timeScale().width();
    if (!width) return;
    st.chart.timeScale().applyOptions({ barSpacing: width / DEFAULT_BAR_COUNT });
}

function homeChart(id) {
    const st = panesState[id];
    if (!st?.chart) return;
    st.chart.timeScale().scrollToRealTime();
    st.chart.priceScale("right").applyOptions({ autoScale: true });
}

function zoomChart(id, direction) {
    const st = panesState[id];
    if (!st?.chart) return;
    const ts  = st.chart.timeScale();
    let next  = (ts.options().barSpacing || 6) + direction * 1;
    if (next < 1) next = 1;
    if (next > 80) next = 80;
    ts.applyOptions({ barSpacing: next });
}

function exportLayout() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const date = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
    const filename = `${fileSafeSymbol(currentSymbol)}_${layout.pane1.tf||"M1"}_${layout.pane2.tf||"M1"}_${layout.split}_${date}.json`;
    const blob = new Blob([JSON.stringify(layout, null, 2)], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
}

document.getElementById("importFile").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { localStorage.setItem("layoutState", reader.result); location.reload(); };
    reader.readAsText(file);
};

// ============================================================================
// Colors
// ============================================================================
// Создать главную серию нужного типа. BarSeries и CandlestickSeries — разные
// типы LWC, у уже созданной серии тип не меняется, поэтому смена типа = снос
// старой серии и создание новой (см. setChartType).
function makeSeries(chart, chartType) {
    const type = CHART_TYPES.includes(chartType) ? chartType : "candles";
    const ctor = type === "bars"
        ? LightweightCharts.BarSeries
        : LightweightCharts.CandlestickSeries;
    return chart.addSeries(
        ctor,
        { priceFormat: { type: 'price', precision: 5, minMove: 0.00001 } },
        0
    );
}

// ── Гистограмма объёма ─────────────────────────────────────────────────────
// Живёт ОВЕРЛЕЕМ на главной пане, а не отдельной паной. Причина техническая:
// IndicatorManager._teardownAllOscillatorSeries() сносит все паны кроме
// нулевой при каждой перестройке осцилляторов — отдельная пана объёма
// уничтожалась бы при добавлении любого RSI. Оверлей поверх свечей вдобавок
// привычнее: так это сделано в TradingView.
//
// Собственная шкала (VOLUME_SCALE_ID) с большим отступом сверху: объём
// прижат к низу и занимает нижнюю четверть, не перекрывая цену.
const VOLUME_SCALE_ID = "vol";

/**
 * Создать серию объёма на панели, если инструмент даёт объём.
 * @param {number} paneId Номер панели (1 или 2).
 * @returns {void}
 */
function ensureVolumeSeries(paneId) {
    const st = panesState[paneId];
    if (!st || !st.chart) return;

    const wanted = instrumentsWithVolume.has(currentSymbol) &&
                   layout.showVolume !== false;

    if (!wanted) {
        if (st.volumeSeries) {
            try { st.chart.removeSeries(st.volumeSeries); } catch (e) {}
            st.volumeSeries = null;
        }
        return;
    }
    if (st.volumeSeries) return;

    st.volumeSeries = st.chart.addSeries(LightweightCharts.HistogramSeries, {
        priceFormat:       { type: "volume" },
        priceScaleId:      VOLUME_SCALE_ID,
        priceLineVisible:  false,
        lastValueVisible:  false,
    }, 0);

    st.chart.priceScale(VOLUME_SCALE_ID).applyOptions({
        // 0.75 сверху — объёму достаётся нижняя четверть панели.
        scaleMargins: { top: 0.75, bottom: 0 },
        visible: false,
    });
}

/**
 * Цвет столбца объёма — по знаку ДЕЛЬТЫ, а не по направлению свечи.
 *
 * Дельта = агрессивные покупки минус продажи. Красить по ней, а не по
 * телу свечи, — единственный способ увидеть расхождение цены и давления
 * бесплатно, не занимая места на экране. Пример из живых данных: свеча
 * падает, а дельта +58.8% — покупатели давили весь бар, но цену не
 * удержали. По цвету тела свечи этого не видно вообще.
 *
 * Провайдер без стороны агрессора дельту не даёт (у FXCM её нет вовсе,
 * у REST-бэкфила Lighter — тоже: он отдаёт объём без разбивки). Тогда
 * откатываемся на направление свечи, чтобы бэкфил не выглядел серым
 * провалом рядом с живыми барами.
 *
 * @param {object} bar Свеча с полями open/close и, возможно, delta.
 * @returns {string} Цвет с прозрачностью.
 */
function volumeBarColor(bar) {
    const positive = (bar.delta != null) ? (bar.delta >= 0)
                                         : (bar.close >= bar.open);
    return positive ? "rgba(38,166,154,0.5)" : "rgba(239,83,80,0.5)";
}

/**
 * Привести свечи к точкам гистограммы объёма.
 * Бары без объёма (FXCM) отбрасываются — рисовать нули незачем.
 * @param {Array<object>} bars Свечи из истории.
 * @returns {Array<object>} Точки для HistogramSeries.
 */
function volumePoints(bars) {
    const out = [];
    for (const b of bars) {
        if (b.vol_base == null) continue;
        out.push({ time: b.time, value: b.vol_base, color: volumeBarColor(b) });
    }
    return out;
}

/**
 * Обновить легенду объёма и дельты.
 * Показывает бар под курсором, а без курсора — последний.
 * @param {number} paneId Номер панели.
 * @param {object} bar Свеча или null.
 * @returns {void}
 */
function renderVolumeLegend(paneId, bar) {
    const el = document.getElementById("volLegend" + paneId);
    if (!el) return;

    const st = panesState[paneId];
    if (!st || !st.volumeSeries || !bar || bar.vol_base == null) {
        el.classList.remove("on");
        el.innerHTML = "";
        return;
    }

    let html = "Vol <b>" + formatTapeSize(bar.vol_base) + "</b>";
    let title = "Объём бара в базовых единицах";

    if (bar.delta != null) {
        const buyers = bar.delta >= 0;
        const cls  = buyers ? "d-pos" : "d-neg";
        const sign = buyers ? "+" : "−";
        const share = bar.vol_base
            ? Math.round(100 * Math.abs(bar.delta) / bar.vol_base) : 0;
        html += '  Δ <span class="' + cls + '">' + sign +
                formatTapeSize(Math.abs(bar.delta)) + " (" + share + "%)</span>";

        // Расхождение дельты и свечи — самое ценное, что показывает дельта,
        // и заметить его по одному цвету столбца трудно. Помечаем явно.
        const priceUp = bar.close >= bar.open;
        if (buyers !== priceUp) {
            html += ' <span class="' + cls + '" title="Цена и давление разошлись">⚠</span>';
            title = priceUp
                ? "Цена выросла, но преобладали агрессивные ПРОДАЖИ — рост без покупателей"
                : "Цена упала, но преобладали агрессивные ПОКУПКИ — падение вопреки покупкам";
        } else {
            title = buyers
                ? "Покупатели давили и цена росла — согласованно"
                : "Продавцы давили и цена падала — согласованно";
        }
        title += ". Цвет столбца объёма = знак дельты, не направление свечи.";
    }
    el.innerHTML = html;
    el.title = title;
    el.classList.add("on");

    // Встаём ПОД легендой индикаторов: она живёт в том же углу и растёт
    // вниз по числу индикаторов (js/indicators.js:_createLegend). Без этого
    // строки накладываются — видно на графике с любым добавленным
    // индикатором.
    const indLegend = st.indicatorManager?._legendEl;
    const offset = (indLegend && indLegend.offsetHeight)
        ? indLegend.offsetHeight + 8 : 6;
    el.style.top = offset + "px";
}

/**
 * Записать историю объёма в серию панели.
 * @param {number} paneId Номер панели.
 * @param {Array<object>} bars Свечи.
 * @returns {void}
 */
function setVolumeData(paneId, bars) {
    ensureVolumeSeries(paneId);
    const st = panesState[paneId];
    if (!st || !st.volumeSeries) {
        renderVolumeLegend(paneId, null);
        return;
    }
    try { st.volumeSeries.setData(volumePoints(bars)); } catch (e) {}
    renderVolumeLegend(paneId, bars[bars.length - 1]);
}

/**
 * Обновить последний столбец объёма живой свечой.
 * @param {number} paneId Номер панели.
 * @param {object} bar Живая свеча.
 * @returns {void}
 */
function updateVolumeBar(paneId, bar) {
    const st = panesState[paneId];
    if (!st || !st.volumeSeries || bar.vol_base == null) return;
    try {
        st.volumeSeries.update({
            time: bar.time, value: bar.vol_base, color: volumeBarColor(bar),
        });
    } catch (e) {}
    // Легенду двигаем только когда курсор не удерживает конкретный бар:
    // иначе цифры прыгали бы под курсором на каждом тике.
    if (!st.legendPinned) renderVolumeLegend(paneId, bar);
}

// Переключить тип отрисовки панели, перенеся данные, цвета, precision,
// индикаторную привязку, рисунки и сигнальные маркеры на новую серию.
function setChartType(paneId, chartType) {
    const st = panesState[paneId];
    if (!st || !st.chart) return;
    const type = CHART_TYPES.includes(chartType) ? chartType : "candles";
    layout[`pane${paneId}`] = layout[`pane${paneId}`] || {};
    if (layout[`pane${paneId}`].chartType === type && st.series) return;
    layout[`pane${paneId}`].chartType = type;
    StorageLayer.autoSave(layout);

    if (st.series) {
        try { st.chart.removeSeries(st.series); } catch (e) {}
        st.signalMarkers = null;   // плагин маркеров жил на старой серии
    }
    st.series = makeSeries(st.chart, type);
    if (st.data?.length) st.series.setData(st.data);

    // Перевесить всё, что держало ссылку на главную серию.
    if (st.drawingEngine)    st.drawingEngine.series    = st.series;
    if (st.indicatorManager) st.indicatorManager.candleSeries = st.series;

    applyPriceFormat(paneId);
    applyColors();
    refreshSignalMarkers();
    st.drawingEngine?.render();
    syncChartTypeButtons(paneId);
}

function applyColors() {
    Object.entries(panesState).forEach(([paneId, p]) => {
        if (!p.series) return;
        const type = layout[`pane${paneId}`]?.chartType || "candles";
        if (type === "bars") {
            // У BarSeries нет фитилей/границ — только up/down тела баров.
            p.series.applyOptions({
                upColor: layout.colors.up, downColor: layout.colors.down
            });
        } else {
            p.series.applyOptions({
                upColor: layout.colors.up, downColor: layout.colors.down,
                wickUpColor: layout.colors.wickUp, wickDownColor: layout.colors.wickDown,
                borderUpColor: layout.colors.up, borderDownColor: layout.colors.down
            });
        }
    });
}
function resetColors() {
    layout.colors = { ...DEFAULT_COLORS };
    applyColors(); StorageLayer.autoSave(layout);
}

// ============================================================================
// Signal panel
// ============================================================================
const signalAudio = new Audio("alert.mp3");
const _signalLog = [];
let _signalIdCounter = 0;
let _signalsVisible = false;
let _signalHideTimer = null;   // 5-min auto-hide for markers
let _skipHideTimer   = null;   // 15-sec auto-hide for SKIP panel only
let _signalPanelIndex = 0;

// Hide the panel overlay without touching marker visibility or btn state
function _signalClose() {
    const panel = document.getElementById("signalPanel");
    if (panel) panel.style.display = "none";
    if (_skipHideTimer) { clearTimeout(_skipHideTimer); _skipHideTimer = null; }
}

function clearSignalHideTimer() {
    if (_signalHideTimer) { clearTimeout(_signalHideTimer); _signalHideTimer = null; }
}

function resetSignalHideTimer() {
    clearSignalHideTimer();
    _signalHideTimer = setTimeout(hideSignalMarkers, 5 * 60 * 1000);
}

function showSignalMarkers() {
    _signalsVisible = true;
    const btn = document.getElementById("signalLogBtn");
    if (btn) { btn.style.background = "#2962FF"; btn.style.color = "#fff"; }
    refreshSignalMarkers();
    resetSignalHideTimer();
}

function hideSignalMarkers() {
    _signalsVisible = false;
    const btn = document.getElementById("signalLogBtn");
    if (btn) { btn.style.background = ""; btn.style.color = ""; }
    refreshSignalMarkers();
    clearSignalHideTimer();
    const panel = document.getElementById("signalPanel");
    if (panel) panel.style.display = "none";
}

function toggleSignalPanel() {
    if (_signalsVisible) {
        hideSignalMarkers();
    } else {
        if (_signalLog.length) renderSignalInPanel(_signalPanelIndex);
        showSignalMarkers();
    }
}

function getMarkersForPane(paneId) {
    const st = panesState[paneId];
    if (!st?.data?.length || !st.chart) return [];
    const tf = st.tfSeconds;
    // Рэндж-ТФ: у сигналов временные метки, снапить их не к чему — маркеров нет.
    if (!tf) return [];
    // Маркер ОБЯЗАН ложиться на точку шкалы: LightweightCharts при раскладке
    // маркеров зовёт timeToCoordinate(marker.time) и оборачивает результат в
    // ensureNotNull — для времени, которого нет на шкале, это бросает "Value is
    // null" (будущий бар, дыра по выходным, либо рассинхрон state.data и шкалы
    // после смены ТФ). Спрашиваем саму шкалу — это та же проверка, что внутри LWC.
    const tscale = st.chart.timeScale();
    return _signalLog
        .filter(s => s.symbol === currentSymbol)
        .map(s => {
            const snapped = Math.floor(s.time / tf) * tf;
            let coord = null;
            try { coord = tscale.timeToCoordinate(snapped); } catch (e) { coord = null; }
            if (coord === null) return null;
            return {
                time:     snapped,
                position: s.direction === "UP" ? "belowBar" : "aboveBar",
                color:    s.direction === "UP" ? "#26a69a" : "#ef5350",
                shape:    "circle",
                size:     1,
                id:       String(s.id),
            };
        })
        .filter(Boolean)
        .sort((a, b) => a.time - b.time);
}

function refreshSignalMarkers() {
    [1, 2].forEach(paneId => {
        const st = panesState[paneId];
        if (!st?.series) return;
        const markers = _signalsVisible ? getMarkersForPane(paneId) : [];
        // LightweightCharts v5 removed ISeriesApi.setMarkers — markers are now a
        // plugin created once per series via createSeriesMarkers(), then updated
        // through its own setMarkers(). The series persists across symbol switches
        // (only its data is replaced), so the primitive is created lazily and reused.
        try {
            if (!st.signalMarkers) {
                st.signalMarkers = LightweightCharts.createSeriesMarkers(st.series, markers);
            } else {
                st.signalMarkers.setMarkers(markers);
            }
        } catch (e) { console.error("signal markers failed:", e); }
    });
}

function navSignal(delta) {
    _signalPanelIndex = Math.max(0, Math.min(_signalLog.length - 1, _signalPanelIndex + delta));
    renderSignalInPanel(_signalPanelIndex);
}

function renderSignalInPanel(index) {
    const panel = document.getElementById("signalPanel");
    if (!panel || !_signalLog[index]) return;
    const entry = _signalLog[index];
    const data  = entry.fullData;

    const isUp  = data.direction === "UP";
    const color = isUp ? "#26a69a" : "#ef5350";
    const arrow = isUp ? "▲ UP" : "▼ DOWN";
    const sessionMap = { london:"Лондон", ny:"NY", asia:"Азия", asia_late:"Азия" };
    const session = sessionMap[data.session] || data.session;
    const hh = String(data.hour_utc).padStart(2,"0");
    const mm = String(data.min_in_hour).padStart(2,"0");
    const pct = data.display_pct || data.confidence;
    const hasMemory = data.winrate !== null && data.samples >= 15;

    const pctLine = hasMemory
        ? "<div style='font-size:11px;color:#aaa;margin-top:3px'>📊 Винрейт: <b style='color:" + color + "'>" + data.winrate + "%</b> <span style='color:#666'>(" + data.samples + ")</span></div>"
        : "<div style='font-size:11px;color:#666;margin-top:3px'>📊 score-based</div>";

    const symbolLink = "<span style='cursor:pointer;text-decoration:underline;pointer-events:all;' onclick='switchSymbol(\"" + data.symbol + "\")'>" + data.symbol + "</span>";

    const navHtml = _signalLog.length > 1
        ? "<div style='display:flex;align-items:center;justify-content:space-between;margin-top:6px;border-top:1px solid #333;padding-top:4px;pointer-events:all;'>" +
          "<button onclick='navSignal(-1)' style='background:none;border:none;color:#aaa;cursor:pointer;font-size:16px;pointer-events:all;'>←</button>" +
          "<span style='font-size:11px;color:#888;'>" + (index + 1) + " / " + _signalLog.length + "</span>" +
          "<button onclick='navSignal(+1)' style='background:none;border:none;color:#aaa;cursor:pointer;font-size:16px;pointer-events:all;'>→</button>" +
          "</div>"
        : "";

    panel.className = "";
    panel.classList.add(isUp ? "up" : "down");
    panel.style.display = "block";
    panel.innerHTML =
        "<span class='sig-close' onclick='_signalClose()'>✕</span>" +
        "<div style='font-size:17px;font-weight:bold;color:" + color + "'>" + arrow + " <span style='font-size:14px'>" + pct + "%</span></div>" +
        pctLine +
        "<div style='font-size:11px;color:#ccc;margin:5px 0 3px'>" + symbolLink + " | " + session + " | " + hh + ":" + mm + " UTC</div>" +
        "<div style='font-size:11px;color:#bbb;line-height:1.6'>" + (data.reason || []).join("<br>") + "</div>" +
        navHtml;
}

// Восстановить _signalLog из серверного реплея (type: "signals_history").
// Идемпотентно: дедупликация по time|symbol|direction, поэтому повторный
// запрос/гонка с живым сигналом не плодят дубликаты стрелок.
function applySignalsHistory(list) {
    if (!Array.isArray(list) || !list.length) return;
    const seen = new Set(_signalLog.map(s => s.time + "|" + s.symbol + "|" + s.direction));
    for (const s of list) {
        if (!s || s.direction === "SKIP") continue;
        const key = s.time + "|" + s.symbol + "|" + s.direction;
        if (seen.has(key)) continue;
        seen.add(key);
        _signalLog.push({
            id:        ++_signalIdCounter,
            time:      s.time,
            direction: s.direction,
            symbol:    s.symbol,
            fullData:  s.data,
        });
    }
    _signalLog.sort((a, b) => a.time - b.time);
    _signalPanelIndex = _signalLog.length - 1;
    if (_signalsVisible) refreshSignalMarkers();
}

function addSignalToLog(data) {
    if (data.direction === "SKIP") return;
    _signalLog.push({
        id:        ++_signalIdCounter,
        time:      Math.floor(Date.now() / 1000),
        direction: data.direction,
        symbol:    data.symbol,
        fullData:  data,
    });
    _signalPanelIndex = _signalLog.length - 1;
    showSignalMarkers();
    renderSignalInPanel(_signalPanelIndex);
}

function showSignal(data) {
    if (data.direction === "SKIP") {
        const panel = document.getElementById("signalPanel");
        if (!panel) return;
        if (_skipHideTimer) { clearTimeout(_skipHideTimer); _skipHideTimer = null; }
        panel.className = "skip";
        panel.style.display = "block";
        panel.innerHTML =
            "<span class='sig-close' onclick='_signalClose()'>✕</span>" +
            "<div style='font-size:12px;font-weight:bold;color:#888'>⏸ ПРОПУСК</div>" +
            "<div style='font-size:11px;color:#999;margin-top:4px'>" + (data.skip_reason || "") + "</div>";
        _skipHideTimer = setTimeout(_signalClose, 15000);
        return;
    }
    signalAudio.currentTime = 0; signalAudio.play().catch(() => {});
    addSignalToLog(data);
}

// ===== BRIEFING PANEL =====

// ── Подбор рэндж-ТФ под инструмент ─────────────────────────────────────────
// R задаётся в ПОИНТАХ (минимальных тиках цены), как в TradingView. Но поинт
// у инструментов различается в тысячи раз: R500 = ~$50 на BTC (темп ≈M5) и
// 0.05 на LIT при цене $2.2 — там бар не закроется никогда. Поэтому при
// первом переключении на инструмент R считается от его цены.
//
// Ориентир 0.08% хода ≈ темп M5 на крипте (замерено на BTC: R500 = $50 =
// 0.077%, бар в среднем за 6 минут).
const RANGE_TARGET_PCT = 0.0008;

// Последняя известная цена по инструменту. Нужна для подбора R в момент
// переключения, когда данные графика уже очищены, а история нового
// инструмента ещё не пришла. Заполняется из instruments (mark_price) и
// обновляется живыми тиками.
const lastKnownPrice = {};

/**
 * Предложить рэндж-ТФ для инструмента по его последней известной цене.
 * @param {string} sym Полный символ ("lighter:BTC").
 * @returns {string|null} Строка вида "R:500" либо null, если цена неизвестна.
 */
function suggestRangeTF(sym) {
    const info  = instrumentPrecision[sym];
    const price = lastKnownPrice[sym];
    if (!info || !info.minMove || !price) return null;

    const points = Math.round(price * RANGE_TARGET_PCT / info.minMove);
    return points >= 1 ? "R:" + points : null;
}

// ============================================================================
// Авто-R по ATR — подбор размера рэндж-бара
// ============================================================================
//
// Размер бара сайзится от ATR по классике: R = k×ATR (k=1 → бар ≈ типичный
// ход). Базис ATR — ВСЕГДА M5, единый для подбора и для дрейфа: (1) на рэндж-ТФ
// ATR по самим барам бессмыслен (они одного размера), (2) M5 стабилен и не
// зависит от того, какой ТФ открыт, (3) R и «пора обновить» считаются по одной
// линейке. Порог дрейфа — ×1.5 в любую сторону.
//
// M5-историю берём разовым запросом через ВРЕМЕННЫЙ WebSocket: у хаба нет
// запроса истории без смены подписки, а трогать подписку паны нельзя. Ответ
// кэшируется на 30 с, чтобы не плодить соединения.

const RANGE_K = 1.0;              // Авто: R = k × ATR(M5)
const RANGE_ATR_PERIOD = 14;
const RANGE_DRIFT = 1.5;          // дрейф метрики, при котором «пора пере-подобрать»
// KVKK (метод Mr Cvokka): R = 0.3 × средний размах (High−Low) свечи M1 «за
// сессию». Крипта 24/7 — жёстких сессий нет, поэтому «сессия» ≈ скользящее окно
// M1 длиной сессии (8 ч = 480 баров). Источник: Litr_v_odnogo/docs/kb_mrcvokka.
const KVKK_K = 0.3;
const KVKK_WINDOW = 480;
const _metricCache = {};          // `${mode}:${sym}` -> {v, ts}

/**
 * Временный WebSocket: разово запросить историю (sym, tf). У хаба нет запроса
 * истории без смены подписки, а трогать пану нельзя — поэтому отдельное
 * короткоживущее соединение. cb(candlesArrayOrNull).
 * @param {string} sym Полный символ.
 * @param {string} tf Временно́й ТФ ("M1"/"M5").
 * @param {function(Array|null):void} cb Колбэк со свечами или null.
 * @returns {void}
 */
function _fetchTfHistory(sym, tf, cb) {
    let done = false, ws;
    const finish = v => { if (done) return; done = true; try { ws.close(); } catch (e) {} cb(v); };
    try { ws = new WebSocket(WS_URL); } catch (e) { cb(null); return; }
    ws.onopen = () => ws.send(JSON.stringify({ type: "set_tf", symbol: sym, tf, requestId: 1 }));
    ws.onmessage = e => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; }
        if (m.type === "history") finish(m.data || []);
    };
    ws.onerror = () => finish(null);
    setTimeout(() => finish(null), 5000);
}

/** Кэшированное значение метрики режима для инструмента (или null). */
function cachedMetric(sym, mode) {
    const c = _metricCache[`${mode}:${sym}`];
    return (c && Date.now() - c.ts < 30000) ? c.v : null;
}
function _storeMetric(sym, mode, v) {
    if (v != null) _metricCache[`${mode}:${sym}`] = { v, ts: Date.now() };
}

/**
 * Базовая метрика режима подбора (в единицах цены), кэш 30 с:
 *   auto — ATR(14) с M5;
 *   kvkk — средний размах High−Low свечи M1 за окно KVKK_WINDOW.
 * @param {string} sym Полный символ.
 * @param {string} mode 'auto' | 'kvkk'.
 * @param {function(number|null):void} cb Колбэк с метрикой или null.
 * @returns {void}
 */
function fetchSizingMetric(sym, mode, cb) {
    const cached = cachedMetric(sym, mode);
    if (cached != null) { cb(cached); return; }
    const tf = mode === "kvkk" ? "M1" : "M5";
    _fetchTfHistory(sym, tf, data => {
        if (!data || !data.length) { cb(null); return; }
        let v = null;
        if (mode === "kvkk") {
            const win = data.slice(-KVKK_WINDOW);
            if (win.length) {
                let sum = 0;
                for (const c of win) sum += (c.high - c.low);
                v = sum / win.length;
            }
        } else {
            if (data.length >= RANGE_ATR_PERIOD + 2) {
                const arr = IndicatorMath.atr(data, RANGE_ATR_PERIOD);
                for (let i = arr.length - 1; i >= 0; i--)
                    if (arr[i].value != null) { v = arr[i].value; break; }
            }
        }
        _storeMetric(sym, mode, v);
        cb(v);
    });
}

/**
 * R в поинтах из метрики: round(k × метрика / тик), минимум 1.
 * k зависит от режима: auto → RANGE_K (×ATR), kvkk → KVKK_K (×средняя M1).
 * @param {number} v Метрика в единицах цены.
 * @param {string} mode Режим подбора.
 * @param {string} sym Полный символ.
 * @returns {number} Число поинтов.
 */
function metricToPoints(v, mode, sym) {
    const mm = instrumentPrecision[sym]?.minMove || pointSizeOf(sym);
    const k = mode === "kvkk" ? KVKK_K : RANGE_K;
    return Math.max(1, Math.round(k * v / mm));
}

/**
 * Множитель k для режима (для подписей в меню).
 * @param {string} mode Режим.
 * @returns {number}
 */
function modeK(mode) { return mode === "kvkk" ? KVKK_K : RANGE_K; }

/**
 * Базлайн сайзинга инструмента: {mode, atr}. mode 'auto'|'kvkk'|'manual';
 * atr — значение метрики режима на момент подбора (опора дрейфа). Ленивая
 * инициализация. Поле зовётся atr исторически, но хранит метрику любого режима.
 * @param {string} sym Полный символ.
 * @returns {{mode:string, atr:number|null}}
 */
function rangeSizing(sym) {
    if (!layout.rangeSizing) layout.rangeSizing = {};
    if (!layout.rangeSizing[sym]) layout.rangeSizing[sym] = { mode: "auto", atr: null };
    return layout.rangeSizing[sym];
}

// ── Кнопка R: тумблер режима + меню размера (Авто/Ручной) ────────────────────

/** Текущий R инструмента в поинтах (из запомненного рэндж-ТФ) или null. */
function currentRangePoints() {
    const tf = layout.rangeTf?.[currentSymbol];
    return tf ? parseRangeTF(tf) : null;
}

/**
 * Применить R (в поинтах) на все панели, где включён рэндж-режим.
 * @param {number} points R в поинтах.
 * @returns {void}
 */
function applyRangePoints(points, paneId) {
    if (!(points > 0)) return;
    const tf = "R:" + points;
    layout.rangeTf = layout.rangeTf || {};
    layout.rangeTf[currentSymbol] = tf;   // запомненный R инструмента (дефолт)
    // Применяем ТОЛЬКО к своей панели — панели независимы.
    if (paneId && layout[`pane${paneId}`]?.rangeOn) setTF(paneId, tf);
    StorageLayer.autoSave(layout);
}

/**
 * Включить/выключить рэндж-режим панели. Вкл → применяем R (запомненный или
 * авто-подбор); выкл → возврат на последний временно́й ТФ.
 * @param {number} paneId Панель.
 * @param {boolean} on Включить ли рэндж.
 * @returns {void}
 */
function setRangeOn(paneId, on) {
    const p = layout[`pane${paneId}`] || (layout[`pane${paneId}`] = {});
    p.rangeOn = !!on;
    StorageLayer.autoSave(layout);
    if (on) {
        let tf = layout.rangeTf?.[currentSymbol];
        if (tf) { setTF(paneId, tf); refreshOpenRMenus(); }
        else {
            // Нет запомненного R — подбор по текущему режиму (async).
            pickR(paneId, rangeSizing(currentSymbol).mode, /*apply=*/true);
        }
    } else {
        const back = p.lastTimeTf || "M1";
        const els = getPaneElements(paneId);
        if (els?.tfSelect) els.tfSelect.value = back;
        setTF(paneId, back);
    }
    syncRButtons();
    refreshOpenRMenus();
}

/**
 * Подбор R по режиму (auto=ATR M5, kvkk=0.3×средняя M1). Считает целевой R,
 * запоминает метрику как базлайн дрейфа.
 * @param {number} paneId Панель (для применения).
 * @param {string} mode Режим 'auto' | 'kvkk'.
 * @param {boolean} apply Применять сразу (true) или только вернуть в колбэк.
 * @param {function(number|null):void} [cb] Колбэк с целевым R в поинтах.
 * @returns {void}
 */
function pickR(paneId, mode, apply, cb) {
    fetchSizingMetric(currentSymbol, mode, v => {
        if (v == null) { if (cb) cb(null); return; }
        const points = metricToPoints(v, mode, currentSymbol);
        const sz = rangeSizing(currentSymbol);
        sz.mode = mode;
        sz.atr = v;                         // базлайн дрейфа (метрика режима)
        StorageLayer.autoSave(layout);
        if (apply) applyRangePoints(points, paneId);
        syncRButtons();
        refreshOpenRMenus();
        if (cb) cb(points);
    });
}

/**
 * Подсветка кнопок R. Кнопка НЕЙТРАЛЬНА в обычном состоянии (не «активный
 * инструмент») — оранжевый «r-alert» загорается ТОЛЬКО когда пора пере-подобрать:
 * режим auto, есть базлайн, дрейф M5-ATR > порога, И эта панель реально в рэндже.
 * Fetch кэшируется, поэтому вызывать можно часто.
 * @returns {void}
 */
function syncRButtons() {
    // Индикация режима: кнопка панели в рэндже — с акцентной подсветкой (.on),
    // ПОПАНЕЛЬНО (не «любая панель»), чтобы было видно, у какого графика рэндж.
    // Цвет .on (акцент) отличается от оранжевого .r-alert («пора обновить»).
    [1, 2].forEach(id => {
        const b = document.getElementById("rBtn" + id);
        if (b) b.classList.toggle("on", layout[`pane${id}`]?.rangeOn === true);
    });

    const sz = layout.rangeSizing?.[currentSymbol];
    const canDrift = sz && (sz.mode === "auto" || sz.mode === "kvkk") && sz.atr > 0;
    if (!canDrift) { setRAlert(false); return; }
    fetchSizingMetric(currentSymbol, sz.mode, v => {
        if (v == null) { setRAlert(false); return; }
        const drift = v / sz.atr;
        const over  = drift > RANGE_DRIFT || drift < 1 / RANGE_DRIFT;
        [1, 2].forEach(id => setRAlertPane(id, over && layout[`pane${id}`]?.rangeOn === true));
        refreshOpenRMenus();
    });
}

/** Зажечь/погасить «пора обновить» на кнопке одной панели. */
function setRAlertPane(id, alert) {
    const b = document.getElementById("rBtn" + id);
    if (b) b.classList.toggle("r-alert", !!alert);
}

/** Погасить (или зажечь на обеих) «пора обновить». */
function setRAlert(alert) {
    [1, 2].forEach(id => setRAlertPane(id, !!alert));
}

/**
 * HTML меню кнопки R из текущего состояния инструмента/панели.
 * @param {number} paneId Панель.
 * @returns {string}
 */
function rMenuHTML(paneId) {
    const on   = layout[`pane${paneId}`]?.rangeOn === true;
    const sz   = rangeSizing(currentSymbol);
    const pts  = currentRangePoints();
    const curR = pts ? formatRLabel(pts, currentSymbol) : "—";

    // Строка дрейфа (auto/kvkk с базлайном). Метрику берём из кэша своего режима.
    let drift = "";
    if ((sz.mode === "auto" || sz.mode === "kvkk") && sz.atr > 0) {
        const cur = cachedMetric(currentSymbol, sz.mode);
        if (cur != null) {
            const d = cur / sz.atr;
            const label = sz.mode === "kvkk" ? "Средняя M1" : "ATR";
            if (d > RANGE_DRIFT || d < 1 / RANGE_DRIFT)
                drift = `<div class="r-info r-drift">${label} ушла в ${d.toFixed(2)}× — стоит пере-подобрать</div>`;
            else
                drift = `<div class="r-info">Дрейф ${d.toFixed(2)}× — в норме</div>`;
        }
    }

    const manualTV = pts ? pointsToTV(pts, currentSymbol)
                         : (currentSymbol.startsWith("fxcm:") ? 10 : 100);

    // Строка режима: радио + (для auto/kvkk) кнопка подбора + дрейф.
    const modeRow = (mode, title) => `
        <label class="r-row"><input type="radio" name="rmode${paneId}" ${sz.mode === mode ? "checked" : ""}
            onchange="setRMode(${paneId}, '${mode}')">${title}</label>
        ${sz.mode === mode ? `<button class="r-apply" onclick="rPickNow(${paneId})">Подобрать сейчас</button>${drift}` : ""}`;

    return `
        <label class="r-row"><input type="checkbox" ${on ? "checked" : ""}
            onchange="setRangeOn(${paneId}, this.checked)"><b>Рэндж-бары</b>
            <span style="margin-left:auto;color:var(--muted)">${on ? curR : ""}</span></label>
        <div class="r-sep"></div>
        ${modeRow("auto", "Авто (1×ATR M5)")}
        ${modeRow("kvkk", "KVKK (0.3×ср. M1)")}
        <label class="r-row"><input type="radio" name="rmode${paneId}" ${sz.mode === "manual" ? "checked" : ""}
            onchange="setRMode(${paneId}, 'manual')">Ручной</label>
        ${sz.mode === "manual" ? `<div class="r-manual"><span>R</span>
            <input type="number" id="rManual${paneId}" min="0.1" step="0.1" value="${manualTV}"
                   onchange="rApplyManual(${paneId}, this.value)">
            <span style="color:var(--muted)">как в TV</span></div>` : ""}`;
}

/** Открыть/закрыть меню R под кнопкой панели. */
function toggleRMenu(paneId, e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById("rMenu" + paneId);
    const btn  = document.getElementById("rBtn" + paneId);
    if (!menu || !btn) return;
    const wasOpen = menu.classList.contains("open");
    closeMoreMenus();
    if (wasOpen) return;
    menu.innerHTML = rMenuHTML(paneId);
    const r = btn.getBoundingClientRect();
    menu.style.position = "fixed";
    menu.style.top = (r.bottom + 6) + "px";
    let left = r.left;
    if (left + 220 > window.innerWidth) left = window.innerWidth - 220;
    menu.style.left = Math.max(6, left) + "px";
    menu.style.right = "auto";
    menu.classList.add("open");
    // Обновим дрейф в свежеоткрытом меню (fetch async, дорисует строку).
    const sz = rangeSizing(currentSymbol);
    if (sz.mode === "auto" || sz.mode === "kvkk")
        fetchSizingMetric(currentSymbol, sz.mode, () => refreshOpenRMenus());
}

/** Перерисовать открытые меню R (после смены состояния/прихода ATR). */
function refreshOpenRMenus() {
    [1, 2].forEach(id => {
        const m = document.getElementById("rMenu" + id);
        if (m && m.classList.contains("open")) m.innerHTML = rMenuHTML(id);
    });
}

/** Сменить режим размера (auto/kvkk/manual). */
function setRMode(paneId, mode) {
    rangeSizing(currentSymbol).mode = mode;
    StorageLayer.autoSave(layout);
    refreshOpenRMenus();
    syncRButtons();
}

/** «Подобрать сейчас» — подбор по текущему режиму с превью и подтверждением. */
function rPickNow(paneId) {
    const mode = rangeSizing(currentSymbol).mode;
    pickR(paneId, mode, /*apply=*/false, points => {
        if (!points) { alert("Не удалось получить историю для подбора."); return; }
        const cur = currentRangePoints();
        const src = mode === "kvkk" ? `${KVKK_K}×ср.M1` : `${RANGE_K}×ATR M5`;
        const newR = formatRLabel(points, currentSymbol);
        const msg = cur
            ? `Текущий ${formatRLabel(cur, currentSymbol)} → станет ${newR} (${src}). Применить?`
            : `Размер бара: ${newR} (${src}). Применить?`;
        if (confirm(msg)) {
            if (!layout[`pane${paneId}`]?.rangeOn) setRangeOn(paneId, true);
            applyRangePoints(points, paneId);
            setRAlert(false);
            refreshOpenRMenus();
        }
    });
}
