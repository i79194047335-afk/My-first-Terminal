/**
 * Показать или скрыть гистограмму объёма на обеих панелях.
 * Настройка глобальная, а не по панели: панели показывают один инструмент,
 * и объём у него либо есть, либо нет.
 * @param {boolean} visible Показывать ли объём.
 * @returns {void}
 */
/**
 * Попросить хаб включить или выключить поток стакана для панели.
 *
 * Подписка у биржи заводится только на время просмотра — она стоит около
 * 1.1 ГБ в сутки на инструмент, поэтому «на всякий случай» её не держат.
 * @param {number} paneId Панель.
 * @param {boolean} on Нужен ли поток.
 * @returns {void}
 */
function requestOrderbook(paneId, on) {
    const ws = panesState[paneId]?.ws;
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "orderbook", enabled: !!on }));
    }
}

/**
 * Показать или скрыть авторисовалку «Крюков Росса» на обеих панелях.
 *
 * Состояние — глобальное (layout.showRossHooks), крюки живут на любом
 * инструменте. Данные уже лежат в оверлее (setData из истории), поэтому
 * включение/выключение — только смена флага и перерисовка.
 * @param {boolean} visible Показывать ли.
 * @returns {void}
 */
function setRossHooksVisible(visible) {
    const on = !!visible;
    layout.showRossHooks = on;
    StorageLayer.autoSave(layout);
    [1, 2].forEach(id => {
        const st = panesState[id];
        if (!st?.rossHooks) return;
        // При включении подхватываем текущую историю панели — вдруг оверлей
        // создан после последней загрузки данных.
        if (on && st.data?.length) st.rossHooks.setData(st.data);
        st.rossHooks.setEnabled(on);
    });
    syncRossHooksButtons();
    refreshOpenRHMenu();
}

/**
 * Перерисовать открытое меню разметки Росса (обновить галочки/доступность).
 * @returns {void}
 */
function refreshOpenRHMenu() {
    [1, 2].forEach(id => {
        const m = document.getElementById("rhMenu" + id);
        if (m && m.classList.contains("open")) m.innerHTML = rhMenuHTML(id);
    });
}

/**
 * Параметры разметки Росса (свинг-порог + слои). Ленивая инициализация с
 * дефолтами. Хранится в layout.rossHooks, переживает перезагрузку.
 * @returns {{swingMult:number, layers:Object}}
 */
function rhParams() {
    if (!layout.rossHooks) layout.rossHooks = {};
    const rc = layout.rossHooks;
    if (typeof rc.swingMult !== "number") rc.swingMult = 2.0;
    if (!rc.layers) rc.layers = { structure: true, pattern123: true, rh: true, rhr: true };
    return rc;
}

/**
 * Применить текущие параметры разметки к оверлеям обеих панелей.
 * @returns {void}
 */
function applyRHParams() {
    const rc = rhParams();
    [1, 2].forEach(id => {
        const st = panesState[id];
        if (st?.rossHooks) st.rossHooks.setParams({
            swingMode: "atr", swingMult: rc.swingMult, layers: { ...rc.layers }
        });
    });
}

/**
 * Включить/выключить слой разметки (structure|pattern123|rh|rhr).
 * @param {string} name Слой.
 * @param {boolean} on Показывать ли.
 * @returns {void}
 */
function setRHLayer(name, on) {
    rhParams().layers[name] = !!on;
    StorageLayer.autoSave(layout);
    applyRHParams();
}

/**
 * Задать порог свинга (× ATR). Мельче → чувствительнее свинги.
 * @param {number|string} v Множитель ATR.
 * @returns {void}
 */
function setRHSwing(v) {
    const n = parseFloat(v);
    if (isFinite(n) && n > 0) { rhParams().swingMult = n; StorageLayer.autoSave(layout); applyRHParams(); }
}

/**
 * Собрать HTML меню разметки Росса из текущего состояния.
 * @param {number} paneId Панель (для уникальных id инпутов).
 * @returns {string}
 */
function rhMenuHTML(paneId) {
    const rc = rhParams();
    const on = layout.showRossHooks === true;
    const row = (name, label) => {
        const checked = rc.layers[name] ? "checked" : "";
        const dis = on ? "" : "disabled";
        return `<label class="rh-row"><input type="checkbox" ${checked} ${dis}
            onchange="setRHLayer('${name}', this.checked)"><span>${label}</span></label>`;
    };
    return `<label class="rh-row master"><input type="checkbox" ${on ? "checked" : ""}
                onchange="setRossHooksVisible(this.checked)"><span>Показать разметку</span></label>`
        + row("structure", "Структура (HH/HL)")
        + row("pattern123", "Формация 1-2-3")
        + row("rh", "Крюки RH")
        + row("rhr", "Развороты RHR")
        + `<div class="rh-thr"><span>Порог свинга, ×ATR</span>
             <input type="number" min="0.2" max="10" step="0.1" value="${rc.swingMult}"
                    ${on ? "" : "disabled"} onchange="setRHSwing(this.value)"></div>`;
}

/**
 * Открыть/закрыть меню разметки Росса под кнопкой тулбара панели.
 * @param {number} paneId Панель.
 * @param {Event} e Событие клика.
 * @returns {void}
 */
function toggleRHMenu(paneId, e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById("rhMenu" + paneId);
    const btn  = document.getElementById("rhBtn" + paneId);
    if (!menu || !btn) return;
    const wasOpen = menu.classList.contains("open");
    closeMoreMenus();
    if (wasOpen) return;
    menu.innerHTML = rhMenuHTML(paneId);
    const r = btn.getBoundingClientRect();
    menu.style.position = "fixed";
    menu.style.top = (r.bottom + 6) + "px";
    // Пытаемся выровнять по левому краю кнопки, но не вылезаем за экран.
    let left = r.left;
    if (left + 210 > window.innerWidth) left = window.innerWidth - 210;
    menu.style.left = Math.max(6, left) + "px";
    menu.style.right = "auto";
    menu.classList.add("open");
}

/**
 * Подсветить кнопки крюков в тулбарах обеих панелей по layout.showRossHooks.
 * @returns {void}
 */
function syncRossHooksButtons() {
    const on = layout.showRossHooks === true;
    ["rhBtn1", "rhBtn2"].forEach(id => {
        const b = document.getElementById(id);
        if (b) b.classList.toggle("on", on);
    });
}

/**
 * Показать или скрыть гистограмму стакана.
 * @param {boolean} visible Показывать ли.
 * @returns {void}
 */
function setOrderbookVisible(visible) {
    const on = !!visible && orderbookAvailable();
    layout.showOrderbook = on;
    StorageLayer.autoSave(layout);
    [1, 2].forEach(id => {
        const st = panesState[id];
        if (!st?.orderbookOverlay) return;
        st.orderbookOverlay.setEnabled(on);
        requestOrderbook(id, on);
    });
    syncOrderbookButtons();
}

/**
 * Есть ли у текущего инструмента стакан.
 *
 * Стакан даёт только биржа. У FXCM его нет вовсе: там поток котировок, а не
 * книга заявок, и рисовать нечего.
 * @returns {boolean}
 */
function orderbookAvailable() {
    return instrumentsWithVolume.has(currentSymbol);
}

/**
 * Подсветить активную кнопку стакана и погасить строку, если стакана нет.
 * @returns {void}
 */
function syncOrderbookButtons() {
    const has = orderbookAvailable();
    const on  = has && layout.showOrderbook === true;
    document.querySelectorAll("#orderbookToggle button").forEach(b =>
        b.classList.toggle("on", b.dataset.orderbookBtn === (on ? "on" : "off")));
    const row = document.getElementById("orderbookRow");
    if (row) {
        row.style.opacity = has ? "" : "0.45";
        row.title = has ? "" : "У этого инструмента нет стакана (только биржи)";
    }
}

function setVolumeVisible(visible) {
    layout.showVolume = !!visible;
    StorageLayer.autoSave(layout);
    [1, 2].forEach(id => {
        ensureVolumeSeries(id);
        const st = panesState[id];
        if (st?.volumeSeries && st.data?.length) setVolumeData(id, st.data);
    });
    syncVolumeButtons();
}

/**
 * Подсветить активную кнопку объёма и погасить строку, если объёма нет.
 * @returns {void}
 */
function syncVolumeButtons() {
    const has = instrumentsWithVolume.has(currentSymbol);
    const on  = has && layout.showVolume !== false;
    document.querySelectorAll("#volumeToggle button").forEach(b =>
        b.classList.toggle("on", b.dataset.volumeBtn === (on ? "on" : "off")));
    const row = document.getElementById("volumeRow");
    if (row) {
        row.style.opacity = has ? "" : "0.45";
        row.title = has ? "" : "У этого инструмента нет биржевого объёма";
    }
}
function setTheme(theme) {
    layout.theme = (theme === "dark") ? "dark" : "light";
    applyTheme(layout.theme);
    StorageLayer.autoSave(layout);
}

// ── Меню «⋯» (редкие действия: удалить всё, сбросить масштаб) ──
function closeMoreMenus() {
    document.querySelectorAll(".tb-more-menu.open").forEach(m => m.classList.remove("open"));
}
function toggleMoreMenu(paneId, e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById("moreMenu" + paneId);
    const btn  = document.getElementById("moreBtn" + paneId);
    if (!menu || !btn) return;
    const wasOpen = menu.classList.contains("open");
    closeMoreMenus();
    if (wasOpen) return;
    // Позиционируем меню под кнопкой (fixed, чтобы не обрезалось тулбаром).
    const r = btn.getBoundingClientRect();
    menu.style.position = "fixed";
    menu.style.top   = (r.bottom + 6) + "px";
    menu.style.right = (window.innerWidth - r.right) + "px";
    menu.classList.add("open");
}
// Закрытие по клику вне меню.
document.addEventListener("click", e => {
    if (!e.target.closest(".tb-more-menu") && !e.target.closest('[id^="moreBtn"]'))
        closeMoreMenus();
});

// ============================================================================
// Mobile
// ============================================================================
let currentMobileTab = 1;
function isMobile() { return window.innerWidth <= 768; }

function switchMobileTab(tabNum) {
    if (!isMobile()) return;
    currentMobileTab = tabNum;
    const col1 = document.getElementById("column1"), col2 = document.getElementById("column2");
    const tab1 = document.getElementById("mobTab1"),  tab2 = document.getElementById("mobTab2");
    if (tabNum === 1) {
        col1.classList.add("mob-active"); col2.classList.remove("mob-active");
        tab1.classList.add("active");     tab2.classList.remove("active");
    } else {
        col2.classList.add("mob-active"); col1.classList.remove("mob-active");
        tab2.classList.add("active");     tab1.classList.remove("active");
    }
    requestAnimationFrame(() => {
        document.body.offsetHeight;
        [1, 2].forEach(k => {
            const div = document.getElementById(`chart${k}`);
            const st  = panesState[k];
            if (div && st?.chart) st.chart.resize(div.clientWidth, div.clientHeight);
        });
    });
}

function initMobileLayout() {
    if (!isMobile()) return;
    document.getElementById("column1").classList.add("mob-active");
    document.getElementById("column2").classList.remove("mob-active");
}

function toggleMobileLayout(e) {
    if (e) e.stopPropagation();
    // Save/Load разметки переехали в меню «⋯» тулбара — на мобиле открываем его.
    toggleMoreMenu(1, e);
}

window.addEventListener("resize", () => {
    if (isMobile()) switchMobileTab(currentMobileTab);
});

// ============================================================================
// Initialize
// ============================================================================
function initialize() {
    initCandleColorMenu();
    initLineContextMenu();

    panes.forEach(createPane);
    applyColors();

    // Тема — из сохранённого layout (по умолчанию светлая)
    applyTheme(layout.theme || "light");

    // Sync btn initial state
    const syncBtn = document.getElementById("chartSyncBtn");
    if (syncBtn && syncEnabled) syncBtn.classList.add("on");

    // Автопереход по сигналу — состояние из сохранённого layout.
    syncAutoJumpBtn();

    // Лента — состояние из сохранённого layout.
    tapeVisible = layout.showTape === true;
    applyTapeVisibility();
    resetTape();

    // Symbol selector
    const symbolSelect = document.getElementById("symbolSelect");
    if (symbolSelect) {
        symbolSelect.value = currentSymbol;
        symbolSelect.onchange = e => switchSymbol(e.target.value);
    }

    // Restore layout split.
    // ВАЖНО: прячем колонку тем же механизмом, что и toggleFull (инлайновый
    // style.display + flex видимой колонки), а НЕ классом .hidden. Класс —
    // это display:none !important, и toggleFull, снимающий скрытие через
    // style.display="" , не может его перебить: выход из фулскрина после
    // перезагрузки молча не срабатывал (баг «нельзя вернуться в сплит»).
    const _col1 = document.getElementById("column1");
    const _col2 = document.getElementById("column2");
    if (layout.split === "leftFull") {
        _col2.style.display = "none"; _col1.style.flex = "1 1 100%";
    } else if (layout.split === "rightFull") {
        _col1.style.display = "none"; _col2.style.flex = "1 1 100%";
    }

    // Button handlers ("Удалить всё" переехал в меню «⋯» с прямым onclick)
    document.getElementById("chartSyncBtn").onclick = toggleChartSync;

    document.getElementById("hlineBtn1").onclick = () => {
        setTool("hline");
        if (isMobile()) panes.forEach(id => { const st = panesState[id]; if (st?.drawingEngine) st.drawingEngine.showCursor(); });
    };
    document.getElementById("lineOverlayBtn").onclick = () => {
        setTool("lineOverlay");
        if (isMobile()) panes.forEach(id => { const st = panesState[id]; if (st?.drawingEngine) st.drawingEngine.showCursor(); });
    };
    document.getElementById("rectOverlayBtn").onclick = () => {
        setTool("rectOverlay");
        if (isMobile()) panes.forEach(id => { const st = panesState[id]; if (st?.drawingEngine) st.drawingEngine.showCursor(); });
    };

    // Pane-2 drawing buttons — same tools, mobile cursor support
    document.getElementById("hlineBtn2").onclick = () => {
        setTool("hline");
        if (isMobile()) panes.forEach(id => { const st = panesState[id]; if (st?.drawingEngine) st.drawingEngine.showCursor(); });
    };
    document.getElementById("lineOverlayBtn2").onclick = () => {
        setTool("lineOverlay");
        if (isMobile()) panes.forEach(id => { const st = panesState[id]; if (st?.drawingEngine) st.drawingEngine.showCursor(); });
    };
    document.getElementById("rectOverlayBtn2").onclick = () => {
        setTool("rectOverlay");
        if (isMobile()) panes.forEach(id => { const st = panesState[id]; if (st?.drawingEngine) st.drawingEngine.showCursor(); });
    };

    initMobileLayout();
}

initialize();
</script>
